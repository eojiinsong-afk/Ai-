<title>Photo Sorting</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: Apple-style dark UI. Black stage; translucent material bars and sheets; system blue accent; system colors per element. Single dark look by design. */
:root {
  color-scheme: dark;
  --bg: #000000;
  --bg-2: #1C1C1E;
  --fill: rgba(118, 118, 128, .24);
  --fill-2: rgba(118, 118, 128, .36);
  --material: rgba(30, 30, 32, .72);
  --material-solid: #1C1C1E;
  --sep: rgba(84, 84, 88, .55);
  --label: #FFFFFF;
  --label-2: rgba(235, 235, 245, .62);
  --label-3: rgba(235, 235, 245, .32);
  --blue: #0A84FF;
  --orange: #FF9F0A;
  --red: #FF453A;
  --green: #30D158;
  --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  --blur: saturate(180%) blur(20px);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--label); font: 14px/1.45 var(--sans); overflow-x: hidden; -webkit-font-smoothing: antialiased; letter-spacing: -.01em; }
button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 3px solid rgba(10,132,255,.6); outline-offset: 2px; }
.num, .count { font-variant-numeric: tabular-nums; }

/* toolbar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--material); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; min-height: 52px;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--material); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border-bottom: .5px solid var(--sep); }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex-wrap: wrap; }
.brand h1 { margin: 0; font: 600 17px/1 var(--display); letter-spacing: -.02em; }
.brand h1 button { font: inherit; letter-spacing: inherit; background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--label); }
.brand h1 button:hover { opacity: .75; }
.site { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.site select, .site input { background: var(--fill); border: 0; border-radius: 8px; padding: 6px 10px; font-size: 13px; min-width: 0; }
.site input { width: 160px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.btn { border: 0; background: var(--fill); border-radius: 980px; padding: 7px 14px; cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; transition: background .15s, opacity .15s; }
.btn:hover { background: var(--fill-2); }
.btn:active { opacity: .7; }
.btn.primary { background: var(--blue); color: #fff; font-weight: 600; }
.btn.primary:hover { background: #409CFF; }
.btn.ask { background: rgba(255,159,10,.18); color: var(--orange); }
.btn.warn { color: var(--red); }
.btn.small { padding: 5px 11px; font-size: 12.5px; }
.btn[disabled] { opacity: .35; cursor: default; }

/* stage */
.stage { position: relative; width: 100%; min-height: calc(100vh - 52px); }
#sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#rays { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.fx { position: absolute; inset: 0; pointer-events: none; }
.star { position: absolute; left: 0; top: 0; width: 20px; height: 20px; border-radius: 50%; overflow: hidden; will-change: transform, opacity; transform-origin: 50% 50%; pointer-events: auto; cursor: zoom-in;
  box-shadow: 0 0 0 1px rgba(255,255,255,.95), 0 0 8px 2px rgba(200,220,255,.9), 0 0 22px 7px rgba(120,160,255,.45); background: var(--bg-2);
  transition: border-radius .4s, box-shadow .4s; animation: twinkle 3.2s ease-in-out var(--tw, 0s) infinite; }
.star img { filter: saturate(.85) brightness(1.08); }
.star:hover { animation: none; z-index: 3000 !important; box-shadow: 0 0 0 1.5px #fff, 0 0 26px 8px rgba(160,190,255,.7); }
.star.tile { border-radius: 4px; animation: none; box-shadow: 0 0 0 1px rgba(255,255,255,.9), 0 4px 12px rgba(0,0,0,.5); }
@keyframes twinkle { 50% { box-shadow: 0 0 0 1px rgba(255,255,255,.95), 0 0 12px 4px rgba(220,232,255,1), 0 0 30px 10px rgba(130,170,255,.55); } }
.sitecard { position: absolute; z-index: 11; left: max(16px, env(safe-area-inset-left, 0px)); top: 16px; width: 300px; display: flex; flex-direction: column; gap: 8px; padding: 12px;
  background: var(--material); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border: .5px solid var(--sep); border-radius: 16px; }
.sitecard label { display: grid; grid-template-columns: 40px 1fr; white-space: nowrap; align-items: center; gap: 8px; font-size: 12px; color: var(--label-2); }
.sitecard input { min-width: 0; background: var(--fill); border: 0; border-radius: 8px; padding: 7px 9px; font-size: 13px; color: var(--label); color-scheme: dark; }
.scloc { margin: 0; font-size: 12px; color: var(--label-2); font-variant-numeric: tabular-nums; }
.scloc.warn { color: var(--orange); }
.star img { width: 100%; height: 100%; object-fit: cover; display: block; }
.star.scan { box-shadow: 0 0 0 2px var(--blue), 0 0 22px 4px rgba(10,132,255,.6); }

.hud { position: fixed; left: max(24px, env(safe-area-inset-left, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 12; pointer-events: none; display: flex; align-items: baseline; gap: 8px; }
.hud .num { font: 700 64px/1 var(--display); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.hud .label { color: var(--label-2); font-size: 14px; font-weight: 500; }
.pstatus { position: fixed; left: 50%; top: calc(66px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 12; pointer-events: none; color: var(--label-2); font-size: 13px; font-weight: 500; }

.intro { position: absolute; transform: translate(-50%, 0); width: min(360px, calc(100% - 32px)); text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.intro .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.intro .fine { margin: 0; font-size: 12px; color: var(--label-3); }

/* element bubbles */
#rays { opacity: 0; transition: opacity .8s; }
#rays.on { opacity: 1; }
#rays .ln { stroke: rgba(255,255,255,.22); stroke-width: 1; }
#rays .ln.sat { stroke: rgba(255,255,255,.12); }
#rays .satdot { fill: rgba(255,255,255,.55); }
.bubble { position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,.88); background: radial-gradient(circle, rgba(255,255,255,.07), rgba(255,255,255,.02) 70%);
  box-shadow: 0 0 0 7px rgba(255,255,255,.05), 0 0 46px rgba(255,255,255,.14), inset 0 0 30px rgba(255,255,255,.05); cursor: pointer;
  opacity: 0; transform: scale(.3); transition: opacity .5s, transform .6s cubic-bezier(.2,1.3,.4,1); }
.bubble.on { opacity: 1; transform: none; }
.bubble:hover { border-color: #fff; box-shadow: 0 0 0 7px rgba(255,255,255,.08), 0 0 56px rgba(255,255,255,.22), inset 0 0 30px rgba(255,255,255,.06); }
.bubble .t { position: absolute; border: 0; padding: 0; border-radius: 3px; overflow: hidden; background: var(--bg-2); box-shadow: 0 0 0 1px rgba(255,255,255,.8); cursor: pointer;
  opacity: 0; transform: scale(.4); transition: opacity .25s, transform .3s cubic-bezier(.2,1.4,.4,1); }
.bubble .t.on { opacity: 1; transform: none; }
.bubble .t img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bubble .t:hover { z-index: 2; transform: scale(1.25); box-shadow: 0 0 0 1.5px #fff, 0 6px 16px rgba(0,0,0,.6); }
.bubble .t { touch-action: none; user-select: none; -webkit-user-select: none; }
.bubble .t img { -webkit-user-drag: none; }
.bubble.drop { border-color: #fff; box-shadow: 0 0 0 10px color-mix(in srgb, var(--c) 35%, transparent), 0 0 70px color-mix(in srgb, var(--c) 60%, transparent); }
.bubble .t.dragsrc { opacity: .25 !important; }
.peek { position: fixed; z-index: 44; width: 240px; padding: 6px; border-radius: 14px; background: var(--material); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  box-shadow: 0 12px 40px rgba(0,0,0,.55), 0 0 0 .5px rgba(255,255,255,.15); pointer-events: none; opacity: 0; transform: scale(.94); transition: opacity .15s, transform .15s; }
.peek.on { opacity: 1; transform: none; }
.peek img { display: block; width: 100%; max-height: 240px; object-fit: contain; border-radius: 9px; background: #000; }
.peek div { display: flex; align-items: center; gap: 6px; padding: 6px 4px 1px; font-size: 12px; color: var(--label-2); }
.peek div b { font-weight: 600; color: var(--label); display: inline-flex; align-items: center; gap: 5px; }
.peek div b i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.ghost { position: fixed; z-index: 46; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 8px; overflow: hidden; pointer-events: none; box-shadow: 0 0 0 2px #fff, 0 10px 30px rgba(0,0,0,.6); transform: rotate(-4deg); }
.ghost img { width: 100%; height: 100%; object-fit: cover; display: block; }
.dock { position: fixed; z-index: 45; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 32px);
  padding: 8px; border-radius: 16px; background: var(--material); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); box-shadow: 0 8px 30px rgba(0,0,0,.5); }
.dock span { padding: 7px 12px; border-radius: 10px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.06); }
.dock span i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.dock span.drop { background: color-mix(in srgb, var(--c) 45%, transparent); color: #fff; }
.bubble .t.q::after { content: ""; position: absolute; right: 1px; top: 1px; width: 6px; height: 6px; border-radius: 50%; background: var(--orange); }
.blabel { position: absolute; transform: translateX(-50%); text-align: center; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 1px; opacity: 0; transition: opacity .5s; }
.blabel.on { opacity: 1; }
.blabel b { font: 600 14px var(--display); display: inline-flex; align-items: center; gap: 6px; }
.blabel b i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.blabel span { font-size: 12px; color: var(--label-2); font-variant-numeric: tabular-nums; }

/* sheets */
.ask-sheet { position: fixed; z-index: 45; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(540px, calc(100vw - 32px));
  background: var(--material); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border: .5px solid var(--sep); border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.6);
  display: grid; grid-template-columns: 156px 1fr; gap: 16px; padding: 14px; animation: rise .35s cubic-bezier(.2,1.2,.4,1); }
@keyframes rise { from { transform: translate(-50%, 24px); opacity: 0; } }
.ask-img { width: 156px; height: 156px; border-radius: 12px; overflow: hidden; background: var(--bg-2); cursor: zoom-in; border: 0; padding: 0; }
.ask-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ask-body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ask-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ask-top .n { font-size: 12.5px; color: var(--label-2); }
.ask-q { margin: 0; font: 600 17px/1.3 var(--display); }
.ask-guess { margin: 0; font-size: 13px; color: var(--label-2); }
.ask-guess b { color: var(--label); font-weight: 600; }
.ask-foot { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }

.lb { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.88); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  display: grid; grid-template-columns: 1fr 300px; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.lb-img { display: flex; align-items: center; justify-content: center; padding: 24px; min-width: 0; min-height: 0; position: relative; }
.lb-img img { max-width: 100%; max-height: calc(100vh - 48px); object-fit: contain; border-radius: 10px; }
.lb-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--fill); cursor: pointer; font-size: 20px; }
.lb-nav.prev { left: 16px; } .lb-nav.next { right: 16px; }
.lb-side { background: var(--material-solid); border-left: .5px solid var(--sep); padding: 16px 16px 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lb-side h3 { margin: 0; font: 600 15px var(--display); word-break: break-all; }
.lb-close { align-self: flex-end; }
.ai-box { font-size: 13px; color: var(--label-2); }
.ai-box b { color: var(--label); font-weight: 600; }
dl.meta { margin: 0; display: grid; grid-template-columns: auto 1fr; font-size: 13px; background: var(--bg-2); border-radius: 12px; overflow: hidden; }
dl.meta dt, dl.meta dd { margin: 0; padding: 8px 12px; border-bottom: .5px solid var(--sep); }
dl.meta dt { color: var(--label-2); }
dl.meta dd { color: var(--label); text-align: right; word-break: break-all; font-variant-numeric: tabular-nums; }
dl.meta dt:nth-last-of-type(1), dl.meta dd:last-child { border-bottom: 0; }
.field { display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: var(--label-2); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 0; background: var(--fill); border-radius: 980px; padding: 6px 13px; cursor: pointer; font-size: 14px; color: var(--label); }
.chip:hover { background: var(--fill-2); }
.chip .k { font-size: 11px; color: var(--label-3); margin-right: 5px; font-variant-numeric: tabular-nums; }
.chip.guess { box-shadow: inset 0 0 0 1.5px rgba(255,159,10,.7); }
.chip.guess2 { box-shadow: inset 0 0 0 1px rgba(255,159,10,.35); }
.chip.on { background: var(--blue); color: #fff; font-weight: 600; }
.chip.on .k { color: rgba(255,255,255,.7); }
.add-el { display: flex; gap: 6px; }
.add-el input { flex: 1; min-width: 0; font-size: 13px; background: var(--fill); border: 0; border-radius: 8px; padding: 7px 10px; }
.hint { margin: 0; font-size: 12px; color: var(--label-3); }

#orbs { position: absolute; inset: 0; pointer-events: none; z-index: 9; }
.orb { position: absolute; transform: translate(-50%, -50%); border: 0; background: none; padding: 0; cursor: pointer; pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.orb .ob { width: 22px; height: 22px; border-radius: 50%; overflow: hidden; display: block; background: radial-gradient(circle, #fff, #9DB7FF 60%, rgba(120,150,255,0));
  box-shadow: 0 0 10px 3px rgba(190,210,255,.8), 0 0 30px 10px rgba(110,140,255,.35); animation: twinkle 3.6s ease-in-out var(--tw, 0s) infinite; transition: transform .25s; }
.orb .ob img { width: 100%; height: 100%; object-fit: cover; opacity: .45; mix-blend-mode: luminosity; }
.orb .ol { display: flex; flex-direction: column; align-items: center; opacity: .55; transition: opacity .2s; white-space: nowrap; }
.orb .ol b { font: 600 12px var(--sans); color: var(--label); }
.orb .ol i { font: 400 11px var(--sans); color: var(--label-2); font-style: normal; }
.orb:hover .ob, .orb:focus-visible .ob { transform: scale(1.9); }
.orb:hover .ol, .orb:focus-visible .ol { opacity: 1; }
.sitecard .dates { display: flex; align-items: center; gap: 4px; min-width: 0; }
.sitecard .dates input { flex: 1; min-width: 0; padding: 6px 6px; font-size: 12px; }
.sitecard .dates i { font-style: normal; color: var(--label-3); }
.scact { display: flex; gap: 6px; flex-wrap: wrap; }
.overlay { position: fixed; inset: 0; z-index: 48; background: #0B0B0C; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.ovtop { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: .5px solid var(--sep); background: var(--material); }
.ovtop h2 { margin: 0 auto 0 0; font: 600 17px var(--display); }
.abbody { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 420px; }
.abmap { position: relative; align-self: center; justify-self: center; height: min(100%, calc(100vh - 80px)); max-width: 100%; margin: 12px; }
.abmap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.abmap svg path { fill: #1C1C1E; stroke: #48484A; stroke-width: .012; }
.abtiles { position: absolute; inset: 0; }
.atile { position: absolute; transform: translate(-50%, -100%); border: 0; padding: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.atile .ai { position: relative; width: 54px; height: 54px; border-radius: 12px; overflow: visible; display: block; background: var(--bg-2); box-shadow: 0 0 0 2px #fff, 0 6px 16px rgba(0,0,0,.6); }
.atile .ai img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; display: block; }
.atile .ai em { position: absolute; right: -8px; top: -8px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--blue); color: #fff; font: 700 12px/22px var(--sans); font-style: normal; text-align: center; }
.atile .al { font: 600 11.5px var(--sans); color: var(--label); text-shadow: 0 1px 4px #000; white-space: nowrap; }
.atile.on .ai { box-shadow: 0 0 0 3px var(--blue), 0 6px 16px rgba(0,0,0,.6); }
.abpanel { border-left: .5px solid var(--sep); overflow-y: auto; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 18px; background: var(--material-solid); }
.apart header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-bottom: 8px; border-bottom: .5px solid var(--sep); margin-bottom: 8px; }
.apart header .aact { display: flex; flex-direction: row; gap: 6px; flex: none; }
.apart header div { display: flex; flex-direction: column; min-width: 0; }
.apart header b { font: 600 15px var(--display); }
.apart header span { font-size: 12px; color: var(--label-2); }
.agrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 3px; }
.agrid button { aspect-ratio: 1; border: 0; padding: 0; border-radius: 4px; overflow: hidden; cursor: pointer; background: var(--bg-2); box-shadow: inset 0 -3px 0 var(--c); position: relative; }
.agrid img { width: 100%; height: 100%; object-fit: cover; display: block; }
.seg { display: inline-flex; background: var(--fill); border-radius: 9px; padding: 2px; }
.seg label { cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; padding: 5px 14px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--label-2); }
.seg input:checked + span { background: #636366; color: #fff; }
.seg input:focus-visible + span { outline: 2px solid var(--blue); }
.rpbody { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px minmax(0, 1fr); }
.rplist { border-right: .5px solid var(--sep); overflow-y: auto; padding: 8px 0; background: var(--material-solid); }
.rprow { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 10px 16px; cursor: pointer; border-bottom: .5px solid var(--sep); }
.rprow input { accent-color: var(--blue); width: 18px; height: 18px; margin-top: 2px; }
.rprow span { display: flex; flex-direction: column; min-width: 0; }
.rprow b { font: 600 14px var(--sans); }
.rprow i { font-style: normal; font-size: 12px; color: var(--label-2); }
.rppages { overflow-y: auto; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 20px; background: #2C2C2E; }
.rppages canvas { width: min(680px, 100%); height: auto; box-shadow: 0 10px 30px rgba(0,0,0,.5); border-radius: 2px; }
@media (max-width: 860px) {
  .abbody { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); overflow-y: auto; }
  .abmap { height: auto; width: calc(100% - 24px); }
  .abpanel { border-left: 0; border-top: .5px solid var(--sep); }
  .rpbody { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
  .rplist { max-height: 30vh; border-right: 0; border-bottom: .5px solid var(--sep); }
  .rppages { padding: 12px; }
}
.elsheet-bg { position: fixed; inset: 0; z-index: 55; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; padding: 16px; }
.elsheet { width: min(520px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: var(--material); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border: .5px solid var(--sep); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.elsheet .eh { display: flex; justify-content: space-between; align-items: center; }
.elsheet h3 { margin: 0; font: 600 17px var(--display); }
.elrow { display: grid; grid-template-columns: 10px 110px 1fr 28px; gap: 8px; align-items: start; padding: 8px 0; border-top: .5px solid var(--sep); }
.elrow i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-top: 11px; }

async function filesFromDrop(dt) {
  const entries = [...(dt.items || [])].map(i => i.webkitGetAsEntry?.()).filter(Boolean);
  if (!entries.length) return [...dt.files];
  const out = [];
  async function walk(en) {
    if (en.isFile) out.push(await new Promise((r, j) => en.file(r, j)));
    else if (en.isDirectory) { const rd = en.createReader(); let b; do { b = await new Promise((r, j) => rd.readEntries(r, j)); for (const x of b) await walk(x); } while (b.length); }
  }
  for (const en of entries) await walk(en);
  return out;
}

function demoImage(kind, i) {
  const c = document.createElement('canvas'); c.width = 320; c.height = 240;
  const g = c.getContext('2d');
  const sk = g.createLinearGradient(0, 0, 0, 240); sk.addColorStop(0, '#9FB6D8'); sk.addColorStop(1, '#DCE4EE');
  g.fillStyle = sk; g.fillRect(0, 0, 320, 240);
  g.fillStyle = `hsl(28,14%,${46 + (i % 3) * 6}%)`; g.fillRect(0, 40, 320, 200);
  g.fillStyle = '#2B2F38'; g.strokeStyle = '#2B2F38';
  if (kind === '입구') { g.fillRect(120, 110, 80, 130); g.fillStyle = '#C9B48A'; g.fillRect(100, 96, 120, 14); }
  else if (kind === '창') { g.fillStyle = '#E9F1FA'; for (let x = 40; x < 300; x += 70) for (let y = 70; y < 220; y += 70) { g.fillRect(x, y, 44, 48); g.fillStyle = '#2B2F38'; g.fillRect(x + 21, y, 2, 48); g.fillStyle = '#E9F1FA'; } }
  else if (kind === '계단') { g.fillStyle = '#C8CCD4'; for (let s = 0; s < 8; s++) g.fillRect(60 + s * 24, 220 - s * 20, 200 - s * 24, 20); }
  else { g.fillStyle = '#7A6E62'; g.fillRect(70 + i % 40, 70, 180, 170); }
  g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(0, 214, 320, 26);
  g.fillStyle = '#fff'; g.font = '600 14px sans-serif'; g.fillText(`예시 ${i}`, 10, 232);
  return new Promise(r => c.toBlob(r, 'image/jpeg', .85));
}

// 2) 3D 건물: 바깥쪽부터 차례로 솟아오른다
function buildLocal(blds) {
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0B0B0D); scene.fog = new THREE.Fog(0x0B0B0D, 650, 1500);
  const cam = new THREE.PerspectiveCamera(45, 1, 1, 5000); M3.cam = cam; M3.scene = scene; M3.fit();
  scene.add(new THREE.HemisphereLight(0xFFFFFF, 0x1C1C1E, .9));
  const sun = new THREE.DirectionalLight(0xFFF1DD, .75); sun.position.set(300, 600, 200); scene.add(sun);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshLambertMaterial({ color: 0x141416 }));
  ground.rotation.x = -Math.PI / 2; ground.name = 'ground'; scene.add(ground); M3.ground = ground;
  const grid = new THREE.GridHelper(1000, 40, 0x2C2C2E, 0x1C1C1E); grid.position.y = .05; scene.add(grid);
  const ring = new THREE.Mesh(new THREE.RingGeometry(448, 452, 96), new THREE.MeshBasicMaterial({ color: 0x3A3A3C, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = .06; scene.add(ring);
  // 건물을 한 덩어리로 합친다 (그리는 횟수를 줄이려고). 꼭짓점마다 주인 건물 번호를 기억해 클릭에 쓴다.
  M3.blds = blds;

  const lo = new THREE.Color(0x3A3A3C), hi = new THREE.Color(0xC7C7CC), c = new THREE.Color();
  blds.forEach((b, i) => {
    b.H = b.h > 0 ? b.h : Math.max(1, b.floors) * 3.3;
    let shape;
    try { shape = new THREE.Shape(b.pts.map(p => new THREE.Vector2(p[0], p[1]))); } catch (e) { return; }

    const d = Math.hypot(b.pts[0][0], b.pts[0][1]) / 450;
    const delay = (1 - d) * 1.1 + Math.random() * .25;
    for (let k = 0; k < P.length; k += 3) { pos.push(P[k], P[k + 1], P[k + 2]); nor.push(N[k], N[k + 1], N[k + 2]); col.push(c.r, c.g, c.b); del.push(delay); own.push(i); }

  M3.mesh = new THREE.Mesh(geo, mat); scene.add(M3.mesh);
  M3.hl = new THREE.Group(); scene.add(M3.hl);
  M3.shots = new THREE.Group(); scene.add(M3.shots);
  M3.preview = new THREE.Group(); scene.add(M3.preview);
  drawShots();
  // 카메라: 위에서 내려다보다가 비스듬히
  const ctl = new THREE.OrbitControls(cam, $('gl'));
  ctl.enableDamping = true; ctl.maxPolarAngle = 1.45; ctl.minDistance = 25; ctl.maxDistance = 1500; ctl.target.set(0, 0, 0);
  M3.ctl = ctl;
  const from = new THREE.Vector3(0, 1100, 1), to = new THREE.Vector3(-230, 250, 360), t0 = performance.now(), dur = reduceMotion ? 1 : 2600;
  cam.position.copy(from); cam.lookAt(0, 0, 0);
  cancelAnimationFrame(M3.raf);
  const loop = now => {
    const k = Math.min(1, (now - t0) / dur);
    if (k < 1) { const e = 1 - Math.pow(1 - k, 3); cam.position.lerpVectors(from, to, e); cam.lookAt(0, 0, 0); }
    else ctl.update();
    if (uT.value < 9) uT.value = (now - t0) / 1000 * 1.15;

// 사진 표시: 찍은 자리(점) + 바라본 방향(부채꼴) + 공중의 사진
const texCache = new Map();
function texFor(p) { if (!texCache.has(p.id)) { const t = new THREE.TextureLoader().load(thumbUrl(p)); texCache.set(p.id, t); } return texCache.get(p.id); }

    if (placed || on) {

      const ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, sp.position.y - s * .375, 0)]), new THREE.LineBasicMaterial({ color }));

// 사진 고르기 → 찍은 자리 클릭 → 바라본 쪽 클릭
const ray = () => new THREE.Raycaster();
function ndc(e) { const r = $('gl').getBoundingClientRect(); return new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); }

function selectPhoto(id, place) {
  M3.sel = id; const p = S.photos.get(id);
  M3.mode = place || !p.shot ? 'pos' : null;
  M3.hlFloor = p.shot?.inside ? p.shot.floor ?? null : null;
  M3.preview.clear(); drawShots(); renderStrip(); renderMinfo();
  highlightBuilding(p.shot?.target?.i ?? null);
  if (M3.mode === 'pos') hint('촬영 위치 클릭');
  else hint(null);
  const xz = shotPos(p); if (xz && M3.ctl) { M3.ctl.target.set(xz[0], 0, xz[1]); }
}
function onMove(e) {
  if (M3.mode !== 'dir' || !M3.cam) return;
  const g = groundAt(e); if (!g) return;
  const [x, z] = M3.pending, hdg = (Math.atan2(g[0] - x, -(g[1] - z)) / D2R + 360) % 360;
  M3.pendingH = hdg;
  M3.preview.clear();
  const f = fanMesh(hdg, '#0A84FF', .4, 40); f.position.x = x; f.position.z = z; M3.preview.add(f);
  const t = targetBuilding(x, z, hdg); highlightBuilding(t?.i ?? null);
}
function onPick(e) {

    const rc0 = ray(); rc0.setFromCamera(ndc(e), M3.cam);
    const hb0 = M3.mesh && rc0.intersectObject(M3.mesh)[0];
    const g = hb0 ? [hb0.point.x, hb0.point.z] : groundAt(e); if (!g) return;
    M3.pending = g; M3.mode = 'dir';
    M3.preview.clear();

    return;

    const [X, Y] = toWorld(x, z), [lon, lat] = TM.inv(X, Y);
    const ins = insideOf(x, z), t = ins != null ? { i: ins, b: M3.blds[ins], d: 0 } : targetBuilding(x, z, hdg);
    p.shot = { x: +X.toFixed(2), y: +Y.toFixed(2), lon: +lon.toFixed(7), lat: +lat.toFixed(7), heading: hdg, by: 'user', at: new Date().toISOString(),
      inside: ins != null, target: tgtInfo(t) };
    if (ins != null) { const fl = floorsOf(M3.blds[ins]); p.shot.floor = fl.includes(M3.lastFloor) ? M3.lastFloor : 1; }
    savePhoto(p); M3.mode = null; M3.preview.clear();
    hint(ins != null ? `실내 ${floorLabel(p.shot.floor)} · 층 바꾸기는 오른쪽` : t ? `${t.b.addr || ''} ${t.b.use || ''}`.trim() : '저장됨', 3000);

  const rc = ray(); rc.setFromCamera(ndc(e), M3.cam);

  const hb = M3.mesh && rc.intersectObject(M3.mesh)[0];

}
// 층: 1, 2, … 지상 / -1, -2, … 지하. 층 높이는 건물 높이 ÷ 지상 층수
const floorLabel = f => f > 0 ? `${f}F` : `B${-f}`;
const floorH = b => b.H / Math.max(1, b.floors || 1);
const floorY = (b, f) => (f > 0 ? f - 1 : f) * floorH(b);
const floorsOf = b => { const L = []; for (let f = Math.max(1, b.floors || 1); f >= 1; f--) L.push(f); for (let f = 1; f <= (b.base || 0); f++) L.push(-f); return L; };

const tgtInfo = t => t ? { i: t.i, addr: t.b.addr, use: t.b.use, floors: t.b.floors, base: t.b.base, year: t.b.year, height: t.b.h || null, dist: +t.d.toFixed(1) } : null;
// 점이 들어 있는 건물(실내 사진)

    const P = M3.blds[i].pts; if (Math.abs(P[0][0] - px) > 300 || Math.abs(P[0][1] - py) > 300) continue;

// 이 건물을 찍은 사진: 실내(건물 안에서) / 외관(밖에서 바라봄)
function photosOfBuilding(bi) {
  const b = M3.blds[bi], same = t => t && (t.i === bi && (!t.addr || !b.addr || t.addr === b.addr));
  const L = sitePhotos().filter(p => p.shot && same(p.shot.target));
  return { inside: L.filter(p => p.shot.inside), outside: L.filter(p => !p.shot.inside) };
}
// 단면: 위층부터 아래로, 지면선 아래는 지하. 층마다 사진을 요소 순서로
function sectionHTML(b, L) {
  const ord = k => { const i = S.elements.indexOf(k); return i < 0 ? 99 : i; };
  const at = f => L.filter(p => p.shot.floor === f).sort((a, b2) => ord(keyOf(a)) - ord(keyOf(b2)));
  const row = (f, lab) => { const P = f == null ? L.filter(p => !p.shot.floor) : at(f);
    return `<div class="srow${f === M3.hlFloor ? ' on' : ''}${f === 1 ? ' ground' : ''}${!P.length && floorsOf(b).length > 6 ? ' empty' : ''}" ${f != null ? `data-sfloor="${f}"` : ''}><b>${lab}</b><div>${P.map(p => `<button type="button" data-mph="${p.id}" style="--c:${colorOf(keyOf(p))[0]}" title="${esc(keyOf(p))}"><img alt="" src="${thumbUrl(p)}"></button>`).join('')}</div></div>`; };
  const un = L.filter(p => !p.shot.floor).length;
  const used = [...new Set(L.map(p => keyOf(p)))].sort((a, b2) => ord(a) - ord(b2));
  return `<div class="section">${floorsOf(b).map(f => row(f, floorLabel(f))).join('')}</div>${un ? `<div class="section un">${row(null, '층?')}</div>` : ''}
    ${used.length ? `<div class="slegend">${used.map(k => `<span style="--c:${colorOf(k)[0]}"><i></i>${esc(k)} ${L.filter(p => keyOf(p) === k).length}</span>`).join('')}</div>` : '<p>사진 고른 뒤 이 건물 위를 클릭</p>'}`;

  const order = [...S.elements, OTHER, NONE, ...[...by.keys()].filter(k => !S.elements.includes(k) && k !== OTHER && k !== NONE)];
  return order.filter(k => by.get(k)).map(k => `<div class="mgrp" style="--c:${colorOf(k)[0]}"><h5><i></i>${esc(k)}<span>${by.get(k).length}</span></h5>
    <div class="mgrid">${by.get(k).map(p => `<button type="button" data-mph="${p.id}"><img alt="" src="${thumbUrl(p)}"></button>`).join('')}</div></div>`).join('');

// 찍은 자리에서 바라본 방향으로 150m 안에서 처음 만나는 건물
function targetBuilding(x, z, hdg) {
  const dx = Math.sin(hdg * D2R), dz = -Math.cos(hdg * D2R);
  let best = null;
  M3.blds.forEach((b, i) => {
    const P = b.pts; if (Math.hypot(P[0][0] - x, -P[0][1] - z) > 260) return;

const photosOfSite = id => [...S.photos.values()].filter(p => p.siteId === id).sort((a, b) => a.takenAt.localeCompare(b.takenAt));
function selectSite(id) {
  if (S.busy || !S.sites.has(id)) return;
  S.siteId = id; saveSettings(); closeAsk(); clearItems(); renderPlanets();
}
function renderOrbs() {
  const box = $('orbs'); box.innerHTML = '';
  if (S.busy || M3.on) return;
  const others = [...S.sites.values()].filter(s => s.count && s.id !== S.siteId && !s.demo).sort((a, b) => (a.start || '').localeCompare(b.start || ''));
  if (!others.length) return;
  const w = stage.clientWidth, h = Math.min(stage.clientHeight, Math.max(520, innerHeight - $('bar').offsetHeight)), cx = w / 2, cy = h / 2;
  others.forEach((s, i) => {
    const r = seeded(s.id), a = i / others.length * 6.283 + .5 + r() * .5;
    const x = Math.max(40, Math.min(w - 40, cx + Math.cos(a) * w * (.4 + r() * .07)));
    const y = Math.max(300, Math.min(h - 110, cy + Math.sin(a) * h * (.4 + r() * .06)));
    const cover = photosOfSite(s.id)[0];
    box.insertAdjacentHTML('beforeend', `<button type="button" class="orb" data-site="${s.id}" style="left:${x}px;top:${y}px;--tw:${(r() * 4).toFixed(2)}s" aria-label="${esc(s.name)} 열기">
      <span class="ob">${cover ? `<img alt="" src="${thumbUrl(cover)}">` : ''}</span><span class="ol"><b>${esc(s.name)}</b><i>${esc(siteDates(s))} · ${s.count}장</i></span></button>`);
  });
}
$('orbs').addEventListener('click', e => { const o = e.target.closest('[data-site]'); if (o) selectSite(o.dataset.site); });

// ─────────── 지도 앨범: 전국 지도 위의 사진 폴더 ───────────
let koreaP = null;
const AB = { lon0: 124.5, lon1: 131.0, lat0: 33.0, lat1: 38.7, k: Math.cos(36 * D2R) };
const abX = lon => (lon - AB.lon0) * AB.k, abY = lat => AB.lat1 - lat;
async function openAlbum() {
  if (S.busy) return;
  const geo = await (koreaP = koreaP || fetch('data/korea.json').then(r => r.json()).catch(() => null));
  const vw = (AB.lon1 - AB.lon0) * AB.k, vh = AB.lat1 - AB.lat0;
  const paths = (geo?.sido || []).map(f => `<path d="${f.r.map(arr => { let x = 0, y = 0, d = ''; for (let i = 0; i < arr.length; i += 2) { x += arr[i]; y += arr[i + 1]; d += (i ? 'L' : 'M') + abX(x / 1e4).toFixed(3) + ' ' + abY(y / 1e4).toFixed(3); } return d + 'Z'; }).join('')}"/>`).join('');
  $('abMap').style.aspectRatio = `${vw} / ${vh}`;
  $('abMap').innerHTML = `<svg viewBox="0 0 ${vw} ${vh}" preserveAspectRatio="none" aria-hidden="true">${paths}</svg><div class="abtiles" id="abTiles"></div>`;
  // 가까운 답사끼리 한 폴더로
  const sites = [...S.sites.values()].filter(s => s.count && !s.demo), placed = [], lost = [];
  for (const s of sites) { const ll = siteLoc(s); if (!ll) { lost.push(s); continue; } placed.push({ s, x: abX(ll[0]), y: abY(ll[1]) }); }
  const clusters = [];
  for (const it of placed.sort((a, b) => (a.s.start || '').localeCompare(b.s.start || ''))) {
    const c = clusters.find(c => Math.hypot(c.x - it.x, c.y - it.y) < .05);
    if (c) { c.items.push(it); c.x = c.items.reduce((t, q) => t + q.x, 0) / c.items.length; c.y = c.items.reduce((t, q) => t + q.y, 0) / c.items.length; }
    else clusters.push({ x: it.x, y: it.y, items: [it] });
  }
  AB.clusters = clusters.map(c => c.items.map(q => q.s)); AB.lost = lost;
  $('abTiles').innerHTML = clusters.map((c, i) => {
    const ss = c.items.map(q => q.s), cover = photosOfSite(ss[0].id)[0], n = ss.reduce((t, s) => t + s.count, 0);
    const place = (ss[0].addrMatch || ss[0].address || ss[0].name || '').split(' ').filter(t => /[시군구]$/.test(t)).slice(-1)[0] || ss[0].name;
    return `<button type="button" class="atile" data-c="${i}" style="left:${c.x / vw * 100}%;top:${c.y / vh * 100}%"><span class="ai">${cover ? `<img alt="" src="${thumbUrl(cover)}">` : ''}<em>${n}</em></span><span class="al">${esc(place)}${ss.length > 1 ? ` · ${ss.length}` : ''}</span></button>`;
  }).join('');
  $('abLost').hidden = !lost.length; $('abLost').textContent = `위치 없음 ${lost.length}`;
  $('abCount').textContent = `답사 ${sites.length} · 사진 ${sites.reduce((t, s) => t + s.count, 0)}장`;
  $('album').hidden = false;
  showCluster(clusters.length ? AB.clusters.findIndex(cs => cs.some(s => s.id === S.siteId)) : -1);
}
function showCluster(i) {
  const list = i === 'lost' ? AB.lost : AB.clusters[i] || [];
  $('abTiles').querySelectorAll('.atile').forEach(t => t.classList.toggle('on', +t.dataset.c === i));
  $('abPanel').innerHTML = list.length ? list.map(s => {
    const L = photosOfSite(s.id);
    return `<section class="apart"><header><div><b>${esc(s.name)}</b><span>${esc(siteDates(s))}${s.address ? ` · ${esc(s.address)}` : ''} · ${L.length}장</span></div><div class="aact"><button type="button" class="btn small warn" data-del="${s.id}">삭제</button><button type="button" class="btn small" data-open="${s.id}">열기</button></div></header>
      <div class="agrid">${L.map(p => `<button type="button" data-photo="${p.id}" style="--c:${p.element ? colorOf(p.element)[0] : '#8E8E93'}" title="${esc(p.element || '미분류')}"><img alt="" loading="lazy" src="${thumbUrl(p)}"></button>`).join('')}</div></section>`;
  }).join('') : '<p class="hint">지도에서 폴더를 고르세요</p>';
}
$('albumBtn').addEventListener('click', openAlbum);
$('abClose').addEventListener('click', () => ($('album').hidden = true));
$('album').addEventListener('click', e => {
  const t = e.target.closest('.atile'); if (t) { showCluster(+t.dataset.c); return; }
  if (e.target.closest('#abLost')) { showCluster('lost'); return; }
  const o = e.target.closest('[data-open]'); if (o) { $('album').hidden = true; selectSite(o.dataset.open); return; }
  const d = e.target.closest('[data-del]');
  if (d) {
    if (!d.classList.contains('arm')) { d.classList.add('arm'); d.textContent = '삭제 확인'; setTimeout(() => { if (d.isConnected) { d.classList.remove('arm'); d.textContent = '삭제'; } }, 3500); return; }
    const site = S.sites.get(d.dataset.del); deleteSite(d.dataset.del); toast(`${site?.name || '답사'} 삭제됨`); openAlbum(); return;
  }
  const ph = e.target.closest('[data-photo]'); if (ph) openLb(ph.dataset.photo);
});

// ─────────── 정리: 여러 답사를 골라 분류별·답사별로 보고 PDF로 ───────────
const RP = { sel: new Set(), mode: 'element', pages: [] };
function openReport() {
  if (S.busy) return;
  if (!RP.sel.size && S.siteId) RP.sel.add(S.siteId);
  const sites = [...S.sites.values()].filter(s => s.count && (!s.demo || s.id === S.siteId)).sort((a, b) => (b.start || '').localeCompare(a.start || ''));
  $('rpList').innerHTML = sites.map(s => `<label class="rprow"><input type="checkbox" value="${s.id}" ${RP.sel.has(s.id) ? 'checked' : ''}><span><b>${esc(s.name)}</b><i>${esc(siteDates(s))}${s.address ? ` · ${esc(s.address)}` : ''} · ${s.count}장</i></span></label>`).join('');
  for (const r of document.querySelectorAll('[name=rpMode]')) r.checked = r.value === RP.mode;
  $('report').hidden = false; buildReport();
}
let rpT;
function buildReport() { clearTimeout(rpT); rpT = setTimeout(async () => { $('rpPages').innerHTML = '<p class="hint">만드는 중</p>'; RP.pages = await renderPages(); $('rpPages').innerHTML = ''; RP.pages.forEach(c => $('rpPages').appendChild(c)); $('rpPdf').disabled = !RP.pages.length; $('rpInfo').textContent = `${RP.pages.length}쪽`; }, 120); }
$('reportBtn').addEventListener('click', openReport);
$('rpClose').addEventListener('click', () => ($('report').hidden = true));
$('rpList').addEventListener('change', e => { if (e.target.checked) RP.sel.add(e.target.value); else RP.sel.delete(e.target.value); buildReport(); });
document.querySelectorAll('[name=rpMode]').forEach(r => r.addEventListener('change', () => { RP.mode = r.value; buildReport(); }));

const bmpCache = new Map();
async function bmpOf(p) {
  if (!bmpCache.has(p.id)) bmpCache.set(p.id, createImageBitmap(p.blob || p.thumb).catch(() => null));
  return bmpCache.get(p.id);
}
async function renderPages() {
  const sites = [...RP.sel].map(id => S.sites.get(id)).filter(Boolean).sort((a, b) => (a.start || '').localeCompare(b.start || ''));
  if (!sites.length) return [];
  await document.fonts?.ready;
  const PW = 1240, PH = 1754, M = 96, FONT = '"Noto Sans KR", "Apple SD Gothic Neo", -apple-system, sans-serif', pages = [];
  let c, g, y;
  const title = RP.mode === 'element' ? '답사 정리 · 요소별' : '답사 정리 · 답사별';
  const page = () => {
    c = document.createElement('canvas'); c.width = PW; c.height = PH; g = c.getContext('2d');
    g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, PW, PH);
    pages.push(c); y = M;
    g.fillStyle = '#8E8E93'; g.font = `400 18px ${FONT}`; g.textBaseline = 'alphabetic';
    g.fillText(title, M, PH - 52); g.textAlign = 'right'; g.fillText(String(pages.length), PW - M, PH - 52); g.textAlign = 'left';
  };
  const room = need => { if (y + need > PH - 110) page(); };
  const text = (s, size, weight, color, x, yy, maxW) => {
    g.font = `${weight} ${size}px ${FONT}`; g.fillStyle = color;
    let t = String(s ?? ''); if (maxW) while (t.length > 1 && g.measureText(t).width > maxW) t = t.slice(0, -2) + '…';
    g.fillText(t, x, yy);
  };
  const order = () => { const keys = new Set(); for (const s of sites) for (const p of photosOfSite(s.id)) keys.add(keyOf(p)); return [...S.elements, ...[...keys].filter(k => !S.elements.includes(k) && k !== OTHER && k !== NONE), OTHER, NONE].filter(k => keys.has(k)); };
  const heading = (label, sub, color, big) => {
    room(big ? 140 : 96);
    if (color) { g.fillStyle = color; g.beginPath(); g.arc(M + 9, y + (big ? 22 : 16), big ? 9 : 7, 0, 6.283); g.fill(); }
    text(label, big ? 40 : 28, 700, '#1C1C1E', M + (color ? 28 : 0), y + (big ? 36 : 26), PW - 2 * M);
    if (sub) text(sub, 20, 400, '#6E6E73', M + (color ? 28 : 0), y + (big ? 72 : 56), PW - 2 * M - 28);
    y += big ? 104 : 80;
  };
  const grid = async (L, cap) => {
    const cols = 3, gap = 22, cw = (PW - 2 * M - gap * (cols - 1)) / cols, ih = cw * .75, rh = ih + 72;
    for (let i = 0; i < L.length; i += cols) {
      room(rh);
      for (let k = 0; k < cols && i + k < L.length; k++) {
        const p = L[i + k], x = M + k * (cw + gap), b = await bmpOf(p);
        g.fillStyle = '#F2F2F7'; g.fillRect(x, y, cw, ih);
        if (b) { const s = Math.max(cw / b.width, ih / b.height), sw = cw / s, sh = ih / s; g.drawImage(b, (b.width - sw) / 2, (b.height - sh) / 2, sw, sh, x, y, cw, ih); }
        const [l1, l2] = cap(p);
        text(l1, 19, 600, '#1C1C1E', x, y + ih + 30, cw);
        text(l2, 17, 400, '#6E6E73', x, y + ih + 56, cw);
      }
      y += rh;
    }
    y += 12;
  };
  // 표지
  page();
  text('답사 정리', 64, 700, '#1C1C1E', M, y + 64); y += 124;
  text(`${RP.mode === 'element' ? '요소별 모아보기' : '답사별 보기'} · 답사 ${sites.length}곳 · ${new Date().toISOString().slice(0, 10)}`, 24, 400, '#6E6E73', M, y); y += 70;
  for (const s of sites) {
    const L = photosOfSite(s.id), cnt = {}; for (const p of L) cnt[keyOf(p)] = (cnt[keyOf(p)] || 0) + 1;
    room(110);
    g.fillStyle = '#E5E5EA'; g.fillRect(M, y, PW - 2 * M, 1); y += 40;
    text(s.name, 30, 700, '#1C1C1E', M, y); text(`${L.length}장`, 24, 600, '#0A84FF', PW - M - 120, y);
    text([siteDates(s), s.address].filter(Boolean).join(' · ') || '—', 20, 400, '#6E6E73', M, y + 34, PW - 2 * M);
    text(Object.entries(cnt).map(([k, v]) => `${k} ${v}`).join('  ·  '), 19, 400, '#3A3A3C', M, y + 64, PW - 2 * M); y += 96;
  }
  if (RP.mode === 'element') {
    for (const k of order()) {
      const L = sites.flatMap(s => photosOfSite(s.id).filter(p => keyOf(p) === k));
      page(); heading(k, `${L.length}장 · 답사 ${new Set(L.map(p => p.siteId)).size}곳`, colorOf(k)[0], true);
      await grid(L, p => [S.sites.get(p.siteId)?.name || '', [p.takenAt.slice(0, 10), p.shot?.target?.addr || p.aiNote].filter(Boolean).join(' · ')]);
    }
  } else {
    for (const s of sites) {
      const L = photosOfSite(s.id);
      page(); heading(s.name, [siteDates(s), s.address, `${L.length}장`].filter(Boolean).join(' · '), null, true);
      for (const k of order()) {
        const E = L.filter(p => keyOf(p) === k); if (!E.length) continue;
        heading(k, `${E.length}장`, colorOf(k)[0], false);
        await grid(E, p => [`${p.takenAt.slice(5, 16).replace('T', ' ').replace('-', '.')}`, p.shot?.target?.addr || p.aiNote || p.name]);
      }
    }
  }
  return pages;
}
let pdfP = null;
$('rpPdf').addEventListener('click', async () => {
  const btn = $('rpPdf'); if (!RP.pages.length) return;
  btn.disabled = true; btn.textContent = 'PDF 만드는 중';
  try {
    if (!window.jspdf) await (pdfP = pdfP || loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'));
    const doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4', compress: true });
    RP.pages.forEach((cv, i) => { if (i) doc.addPage(); doc.addImage(cv.toDataURL('image/jpeg', .88), 'JPEG', 0, 0, 595.28, 841.89); });
    const names = [...RP.sel].map(id => S.sites.get(id)?.name).filter(Boolean);
    await saveFile(`답사정리_${safe(names.length === 1 ? names[0] : names.length + '곳')}_${new Date().toISOString().slice(0, 10)}.pdf`, doc.output('blob'));
  } catch (e) { console.error(e); toast('PDF 실패 · ' + e.message, 5000); }
  finally { btn.disabled = false; btn.textContent = 'PDF'; }
});

// 로고: 처음 화면(사진 추가)으로
const goHome = () => {
  ['album', 'report', 'elSheet'].forEach(id => ($(id).hidden = true));
  if (!$('lb').hidden) closeLb();
  closeAsk();
  if (M3.on || !$('map').hidden) closeMap();
  if (S.busy) return;
  if ([...S.photos.values()].some(p => p.demo)) dropDemo();
  S.siteId = null; saveSettings(); clearItems(); renderPlanets();
};
$('homeBtn').addEventListener('click', goHome);
document.querySelectorAll('[data-home]').forEach(b => b.addEventListener('click', goHome));

// ─────────── 시작 ───────────
let resizeT;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (!S.busy) renderPlanets(); else sizeSky(); }, 150); });
(async function boot() {
  sizeSky(); centerGalaxy(); requestAnimationFrame(frame);
  const st = await DB.get('settings', 'main');
  if (st?.elements?.length) S.elements = st.elements;
  if (st?.defs) S.defs = { ...DEFAULT_DEFS, ...st.defs };
  for (const p of (await DB.all('photos')) || []) S.photos.set(p.id, p);
  for (const s of (await DB.all('sites')) || []) S.sites.set(s.id, s);
  // 이전 버전(장소별 분류)에서 넘어온 사진은 한 답사로 모은다. 원래 값은 지우지 않는다.
  const orphans = [...S.photos.values()].filter(p => !p.siteId || !S.sites.has(p.siteId));
  if (orphans.length) {
    const s = { id: uid(), name: '이전에 올린 사진', createdAt: new Date().toISOString() }; S.sites.set(s.id, s);
    for (const p of orphans) { p.siteId = s.id; if (p.ask === undefined) { p.ask = !p.element; p.by = p.element ? 'user' : null; } savePhoto(p); }
  }
  for (const s of S.sites.values()) { refreshSite(s); saveSite(s); }
  S.siteId = S.sites.has(st?.siteId) ? st.siteId : [...S.sites.values()].filter(s => s.count).sort((a, b) => (b.start || '').localeCompare(a.start || ''))[0]?.id || null;
  renderPlanets();
  if (!window.exifr) toast('EXIF 읽기 불가 · 파일 날짜 사용', 5000);
})();
})();
</script>

<title>Photo Sorting</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one night-sky stage. Photos gather as a spiral galaxy in the middle, then rays carry them out to planets; each planet opens a card that lists its photos. Single dark look by design. */
:root {
  color-scheme: dark;
  --space: #070A14;
  --space-2: #0D1222;
  --panel: rgba(18, 24, 42, .86);
  --panel-solid: #121A2E;
  --line: rgba(160, 180, 255, .16);
  --ink: #E9ECF7;
  --ink-2: #A9B1CC;
  --ink-3: #6E7898;
  --core: #FFE7B8;
  --accent: #8FA8FF;
  --display: 'Space Grotesk', 'Noto Sans KR', system-ui, sans-serif;
  --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--space); color: var(--ink); font: 14px/1.5 var(--sans); overflow-x: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--space); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(var(--space) 60%, rgba(7,10,20,0)); }
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.brand h1 { margin: 0; font: 700 20px/1 var(--display); letter-spacing: -.01em; }
.brand p { margin: 0; color: var(--ink-3); font-size: 12.5px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: rgba(20,27,48,.7); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; transition: border-color .15s, background .15s; }
.btn:hover { border-color: rgba(160,180,255,.45); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #0A0F22; font-weight: 700; }
.btn.primary:hover { background: #A9BCFF; }
.btn.warn { color: #FFB4B4; }
.btn[disabled] { opacity: .4; cursor: default; }
.gap-select { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.gap-select select { font: inherit; background: var(--panel-solid); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; }

/* stage */
.stage { position: relative; width: 100%; min-height: calc(100vh - 64px); }
#sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#rays { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.fx { position: absolute; inset: 0; pointer-events: none; }
.star { position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 6px; overflow: hidden; will-change: transform;
  box-shadow: 0 0 0 1.5px var(--c, rgba(255,255,255,.7)), 0 0 14px 2px var(--g, rgba(160,180,255,.35)); background: #1A2240; transition: box-shadow .5s; }
.star img { width: 100%; height: 100%; object-fit: cover; display: block; }

.core { position: absolute; transform: translate(-50%, -50%); text-align: center; pointer-events: none; width: 260px; }
.core .num { font: 700 44px/1 var(--display); color: var(--core); text-shadow: 0 0 24px rgba(255,210,140,.55); font-variant-numeric: tabular-nums; }
.core .label { margin-top: 6px; color: var(--ink-2); font-size: 13px; }

.intro { position: absolute; transform: translate(-50%, 0); width: min(440px, calc(100% - 32px)); text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.intro h2 { margin: 0; font: 700 26px/1.25 var(--display); letter-spacing: -.01em; text-wrap: balance; }
.intro p { margin: 0; color: var(--ink-2); text-wrap: balance; }
.intro .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.intro .fine { font-size: 12px; color: var(--ink-3); }

/* planets */
.node { position: absolute; width: 18px; height: 18px; border-radius: 50%; transform: translate(-50%, -50%) scale(0); background: var(--c);
  box-shadow: 0 0 0 4px rgba(255,255,255,.06), 0 0 22px 6px var(--g); transition: transform .45s cubic-bezier(.3,1.6,.5,1); }
.node.on { transform: translate(-50%, -50%) scale(1); }
.node.pulse { animation: pulse .35s ease-out; }
@keyframes pulse { 50% { transform: translate(-50%, -50%) scale(1.35); } }

.card { position: absolute; width: 248px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; transform: scale(.85); transition: opacity .4s, transform .45s cubic-bezier(.2,1.2,.4,1); overflow: hidden; }
.card.on { opacity: 1; transform: none; }
.card::before { content: ""; height: 3px; background: var(--c); display: block; }
.card-head { padding: 10px 12px 8px; display: flex; flex-direction: column; gap: 2px; }
.card-title { display: flex; align-items: center; gap: 8px; }
.card-title .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--g); flex: none; }
.card-title input { flex: 1; min-width: 0; background: transparent; border: 1px solid transparent; border-radius: 6px; color: var(--ink); font: 700 15px/1.3 var(--sans); padding: 2px 4px; margin-left: -4px; }
.card-title input:hover, .card-title input:focus { border-color: var(--line); background: rgba(255,255,255,.04); outline: none; }
.card-title .count { font: 500 12px var(--mono); color: var(--ink-2); flex: none; }
.card-meta { font: 400 11.5px/1.45 var(--mono); color: var(--ink-3); }
.card-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.card-tags span { font-size: 11px; padding: 0 7px; border-radius: 999px; background: rgba(255,255,255,.07); color: var(--ink-2); }
.thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 0 10px 10px; overflow-y: auto; max-height: 172px; }
.thumb { position: relative; aspect-ratio: 1; border-radius: 5px; overflow: hidden; border: 0; padding: 0; cursor: pointer; background: #1A2240; opacity: 0; transform: translateY(6px); transition: opacity .3s, transform .3s; }
.card.on .thumb { opacity: 1; transform: none; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb:hover img { filter: brightness(1.15); }
.thumb .tag { position: absolute; left: 2px; bottom: 2px; font-size: 9.5px; font-weight: 700; padding: 0 4px; border-radius: 3px; background: rgba(7,10,20,.85); color: var(--ink); }

/* lightbox */
.lb { position: fixed; inset: 0; z-index: 50; background: rgba(4,6,12,.86); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  display: grid; grid-template-columns: 1fr 300px; gap: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.lb-img { display: flex; align-items: center; justify-content: center; padding: 24px; min-width: 0; min-height: 0; position: relative; }
.lb-img img { max-width: 100%; max-height: calc(100vh - 48px); object-fit: contain; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
.lb-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: rgba(18,24,42,.8); cursor: pointer; font-size: 18px; }
.lb-nav.prev { left: 16px; } .lb-nav.next { right: 16px; }
.lb-side { background: var(--panel-solid); border-left: 1px solid var(--line); padding: 20px 18px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.lb-side h3 { margin: 0; font-size: 15px; word-break: break-all; }
.lb-close { align-self: flex-end; }
dl.meta { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12.5px; }
dl.meta dt { color: var(--ink-3); }
dl.meta dd { margin: 0; font-family: var(--mono); font-size: 12px; color: var(--ink); word-break: break-all; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--ink-3); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; color: var(--ink); }
.chip .k { font: 500 10.5px var(--mono); color: var(--ink-3); margin-right: 4px; }
.chip.on { background: var(--accent); border-color: var(--accent); color: #0A0F22; font-weight: 700; }
.chip.on .k { color: #2A3570; }
.add-el { display: flex; gap: 6px; }
.add-el input, .field select { flex: 1; min-width: 0; font: inherit; font-size: 13px; background: var(--space-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; }
.hint { font-size: 11.5px; color: var(--ink-3); }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--panel-solid); border: 1px solid var(--line);
  padding: 9px 16px; border-radius: 999px; font-size: 13px; max-width: calc(100vw - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.4); }
.drop { position: fixed; inset: 0; z-index: 40; border: 2px dashed var(--accent); background: rgba(143,168,255,.08); display: flex; align-items: center; justify-content: center; pointer-events: none; }
.drop p { font: 700 18px var(--display); background: var(--panel-solid); padding: 12px 22px; border-radius: 999px; border: 1px solid var(--line); }

@media (max-width: 760px) {
  .brand p { display: none; }
  .bar { position: relative; top: 0; background: var(--space); }
  .btn { padding: 6px 11px; }
  .lb { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; overflow-y: auto; }
  .lb-img { padding: 12px; }
  .lb-img img { max-height: 52vh; }
  .lb-side { border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); }
}
@media (prefers-reduced-motion: reduce) {
  .card, .thumb, .node { transition: none; }
}
</style>

<header class="bar" id="bar">
  <div class="brand">
    <h1>Photo Sorting</h1>
    <p>답사 사진을 촬영 시각과 위치로 장소별로 나눕니다</p>
  </div>
  <div class="actions">
    <label class="gap-select" for="gapSel">나누는 기준
      <select id="gapSel">
        <option value="15">15분 간격</option>
        <option value="30" selected>30분 간격</option>
        <option value="60">1시간 간격</option>
        <option value="120">2시간 간격</option>
      </select>
    </label>
    <button class="btn" id="replayBtn" type="button" disabled>다시 분류하기</button>
    <button class="btn" id="zipBtn" type="button" disabled>ZIP 저장</button>
    <button class="btn warn" id="clearBtn" type="button" hidden>모두 지우기</button>
    <label class="btn primary" for="fileIn">사진 올리기</label>
    <input id="fileIn" type="file" accept="image/*,.heic,.heif" multiple hidden>
  </div>
</header>

<main class="stage" id="stage">
  <canvas id="sky" aria-hidden="true"></canvas>
  <svg id="rays" aria-hidden="true"></svg>
  <div id="planets"></div>
  <div class="fx" id="fx"></div>
  <div class="core" id="core" hidden><div class="num" id="coreNum">0</div><div class="label" id="coreLabel"></div></div>
  <div class="intro" id="intro">
    <h2>사진을 놓으면 은하수로 모였다가, 장소별 행성으로 흩어집니다</h2>
    <p>촬영 시각과 GPS를 읽어 같은 장소에서 찍은 사진끼리 묶습니다. 한 번에 40장 정도가 적당하고, 가로 2000px보다 큰 사진은 2000px로 줄여서 보관합니다.</p>
    <div class="row">
      <label class="btn primary" for="fileIn">사진 올리기</label>
      <button class="btn" id="demoBtn" type="button">예시로 보기</button>
    </div>
    <p class="fine">사진은 이 브라우저 안에서만 처리되고 어디에도 올라가지 않습니다. 아이폰 HEIC도 됩니다.</p>
  </div>
</main>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="사진 보기">
  <div class="lb-img">
    <img id="lbImg" alt="">
    <button class="lb-nav prev" id="lbPrev" type="button" aria-label="이전 사진">‹</button>
    <button class="lb-nav next" id="lbNext" type="button" aria-label="다음 사진">›</button>
  </div>
  <aside class="lb-side">
    <button class="btn lb-close" id="lbClose" type="button">닫기 · Esc</button>
    <h3 id="lbName"></h3>
    <dl class="meta" id="lbMeta"></dl>
    <div class="field">건축요소 <span class="hint">숫자키로도 지정</span>
      <div class="chips" id="lbChips"></div>
      <form class="add-el" id="addElForm"><input id="addElInput" placeholder="요소 추가 (예: 지붕)" maxlength="12"><button class="btn" type="submit">추가</button></form>
    </div>
    <label class="field" for="lbMove">장소 옮기기
      <select id="lbMove"></select>
    </label>
    <p class="hint">← → 사진 넘기기</p>
  </aside>
</div>

<div class="drop" id="drop" hidden><p>놓으면 은하수로 모입니다</p></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script>
(() => {
'use strict';

// ─────────── 설정 ───────────
const MAX_W = 2000;                 // 저장 이미지 가로 최대 px
const THUMB = 220;                  // 애니메이션·목록용 작은 이미지
const DIST_M = 300;                 // 이만큼 떨어지면 다른 장소
const PALETTE = [
  ['#8FA8FF', 'rgba(143,168,255,.55)'], ['#FFB86B', 'rgba(255,184,107,.55)'], ['#6FE3B4', 'rgba(111,227,180,.5)'],
  ['#E39BFF', 'rgba(227,155,255,.5)'], ['#FF8FA3', 'rgba(255,143,163,.5)'], ['#6FD6F0', 'rgba(111,214,240,.5)'],
  ['#F2E27A', 'rgba(242,226,122,.45)'], ['#B7A6FF', 'rgba(183,166,255,.5)']
];
const DEFAULT_ELEMENTS = ['입구', '창', '계단'];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ─────────── 상태 ───────────
const S = { photos: new Map(), planets: new Map(), elements: [...DEFAULT_ELEMENTS], gapMin: 30, busy: false, lbId: null };
const $ = id => document.getElementById(id);
const stage = $('stage'), fx = $('fx'), raysSvg = $('rays'), planetsEl = $('planets');
const urls = new Map();
const objUrl = (key, blob) => { if (!urls.has(key)) urls.set(key, URL.createObjectURL(blob)); return urls.get(key); };
const thumbUrl = p => p.thumb ? objUrl('t' + p.id, p.thumb) : '';
const fullUrl = p => p.blob ? objUrl('f' + p.id, p.blob) : thumbUrl(p);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const sleep = ms => new Promise(r => setTimeout(r, reduceMotion ? 0 : ms));
const pad = n => String(n).padStart(2, '0');

function toast(msg, ms = 2800) {
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), ms);
}

// ─────────── 저장 (IndexedDB, 이 브라우저 안) ───────────
const DB = (() => {
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open('photo-sorting', 1);
        r.onupgradeneeded = () => { for (const s of ['photos', 'planets', 'settings']) if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
    return dbp;
  }
  async function run(store, mode, fn) {
    try {
      const db = await open();
      return await new Promise((res, rej) => {
        const tx = db.transaction(store, mode); const out = fn(tx.objectStore(store));
        tx.oncomplete = () => res(out && 'result' in out ? out.result : undefined); tx.onerror = () => rej(tx.error);
      });
    } catch (e) { console.warn('저장소 사용 불가', e); return undefined; }
  }
  return {
    put: (s, k, v) => run(s, 'readwrite', o => o.put(v, k)),
    del: (s, k) => run(s, 'readwrite', o => o.delete(k)),
    clear: s => run(s, 'readwrite', o => o.clear()),
    get: (s, k) => run(s, 'readonly', o => o.get(k)),
    all: s => run(s, 'readonly', o => o.getAll())
  };
})();
const savePhoto = p => { const { demo, ...rest } = p; return p.demo ? null : DB.put('photos', p.id, rest); };
const savePlanet = pl => (pl.demo ? null : DB.put('planets', pl.id, pl));
const saveSettings = () => DB.put('settings', 'main', { elements: S.elements, gapMin: S.gapMin });

// ─────────── 사진 읽기: EXIF + 2000px로 줄이기 ───────────
let heicLoading = null;
function loadHeic() {
  if (window.heic2any) return Promise.resolve();
  heicLoading = heicLoading || new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';
    s.onload = res; s.onerror = () => rej(new Error('HEIC 변환기를 불러오지 못했습니다'));
    document.head.appendChild(s);
  });
  return heicLoading;
}
const isHeic = f => /\.(heic|heif)$/i.test(f.name) || /heic|heif/i.test(f.type);
const localIso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;

async function readMeta(file) {
  let m = null;
  try { if (window.exifr) m = await exifr.parse(file, { tiff: true, exif: true, gps: true, xmp: false, icc: false, iptc: false }); } catch (e) { console.warn(e); }
  const t = m?.DateTimeOriginal || m?.CreateDate;
  const ok = t instanceof Date && !isNaN(t);
  const gps = Number.isFinite(m?.latitude) && Number.isFinite(m?.longitude) && !(m.latitude === 0 && m.longitude === 0)
    ? [+m.longitude.toFixed(6), +m.latitude.toFixed(6)] : null;
  return {
    takenAt: localIso(ok ? t : new Date(file.lastModified)), timeFromExif: ok, gps,
    heading: Number.isFinite(m?.GPSImgDirection) ? Math.round(m.GPSImgDirection) % 360 : null,
    camera: [m?.Make, m?.Model].filter(Boolean).join(' ') || null
  };
}

async function decode(file) {
  try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) {
    if (!isHeic(file)) return await createImageBitmap(file);
    await loadHeic();
    const out = await heic2any({ blob: file, toType: 'image/jpeg', quality: 0.92 });
    return await createImageBitmap(Array.isArray(out) ? out[0] : out);
  }
}
function toJpeg(bmp, maxW, maxH, q) {
  const s = Math.min(1, maxW / bmp.width, maxH ? maxH / bmp.height : Infinity);
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(b => r({ blob: b, w: c.width, h: c.height }), 'image/jpeg', q));
}
async function processFile(file) {
  const meta = await readMeta(file);
  const bmp = await decode(file);
  const full = await toJpeg(bmp, MAX_W, null, 0.86);
  const th = await toJpeg(bmp, THUMB, THUMB, 0.8);
  const origW = bmp.width, origH = bmp.height;
  bmp.close?.();
  return { id: uid(), name: file.name, sig: `${file.name}|${file.size}|${file.lastModified}`, origSize: file.size, origW, origH,
    w: full.w, h: full.h, size: full.blob.size, blob: full.blob, thumb: th.blob, ...meta, planetId: null, element: null, pinned: false };
}

// ─────────── 분류: 시간 간격 + 거리 ───────────
function dist([a, b], [c, d]) {
  const R = 6371000, r = Math.PI / 180, x = (c - a) * r * Math.cos((b + d) / 2 * r), y = (d - b) * r;
  return Math.hypot(x, y) * R;
}
function center(list) {
  const g = list.filter(p => p.gps);
  if (!g.length) return null;
  return [g.reduce((s, p) => s + p.gps[0], 0) / g.length, g.reduce((s, p) => s + p.gps[1], 0) / g.length].map(v => +v.toFixed(6));
}
function cluster(list, gapMin) {
  const sorted = [...list].sort((a, b) => a.takenAt.localeCompare(b.takenAt));
  const groups = []; let cur = null, lastT = 0, lastG = null;
  for (const p of sorted) {
    const t = new Date(p.takenAt).getTime();

// ─────────── 행성 배치 ───────────
function layoutFor(n) {
  const w = stage.clientWidth;
  const view = Math.max(560, innerHeight - $('bar').offsetHeight);
  const cardW = Math.min(248, w - 32), cardH = 262, gap = 16;
  if (w >= 980 && n <= 6) {
    const perSide = Math.ceil(n / 2);
    const h = Math.max(view, perSide * (cardH + gap) + 48);
    const cx = w / 2, cy = h / 2;
    const side = [];
    for (let i = 0; i < n; i++) side.push(i % 2 === 0 ? 'left' : 'right');
    const slots = { right: side.filter(s => s === 'right').length, left: side.filter(s => s === 'left').length };
    const idx = { right: 0, left: 0 };
    const out = side.map(sd => {
      const k = slots[sd], j = idx[sd]++;
      const top = cy - (k * (cardH + gap) - gap) / 2 + j * (cardH + gap);
      const left = sd === 'right' ? w - cardW - 28 : 28;
      const node = [sd === 'right' ? left - 26 : left + cardW + 26, top + cardH / 2];
      return { left, top, node };
    });
    const avail = (w - 2 * (cardW + 80)) / 2;

  }
  // 좁은 화면 또는 행성이 많을 때: 은하수는 위, 카드는 아래 격자
  const cols = Math.max(1, Math.floor((w - 32 + gap) / (cardW + gap)));
  const rows = Math.ceil(n / cols);
  const topArea = 300;
  const gridW = cols * cardW + (cols - 1) * gap, x0 = (w - gridW) / 2;
  const cards = Array.from({ length: n }, (_, i) => {
    const c = i % cols, r = Math.floor(i / cols);
    const left = x0 + c * (cardW + gap), top = topArea + r * (cardH + 34 + gap) + 34;
    return { left, top, node: [left + cardW / 2, top - 16] };
  });
  return { h: Math.max(view, topArea + rows * (cardH + 34 + gap) + 40), cx: w / 2, cy: 150, r: Math.min(w / 2 - 24, 130), cardW, cards };
}

// ─────────── 사진 올리기 ───────────
async function ingest(files) {
  if (S.busy) { toast('분류가 끝난 뒤에 올려 주세요'); return; }
  files = files.filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|webp|heic|heif)$/i.test(f.name));
  if (!files.length) { toast('사진 파일이 없습니다'); return; }
  // 예시 사진이 있으면 먼저 치운다
  if ([...S.photos.values()].some(p => p.demo)) dropDemo();
  const seen = new Set([...S.photos.values()].map(p => p.sig));
  const todo = files.filter(f => !seen.has(`${f.name}|${f.size}|${f.lastModified}`));
  if (!todo.length) { toast('이미 올린 사진입니다'); return; }
  S.busy = true; updateButtons(); $('intro').hidden = true;
  if (planetsEl.childElementCount) await gatherExisting(); else { renderPlanetsShell(); }
  spin = .18; glow = .7;
  let done = 0, failed = 0, heic = 0, bigger = 0, saved = 0;
  setCore(`0/${todo.length}`, '사진을 읽는 중');
  const added = [], queue = [...todo];
  async function worker() {
    while (queue.length) {
      const f = queue.shift();
      try {
        if (isHeic(f)) heic++;
        const p = await processFile(f);
        if (p.origW > MAX_W) { bigger++; saved += Math.max(0, p.origSize - p.size); }
        S.photos.set(p.id, p); added.push(p);
        await savePhoto(p);
        // 화면 가장자리에서 날아 들어온다
        const edge = Math.random() * 4 | 0, w = stage.clientWidth, h = stage.clientHeight;
        const sx = edge === 0 ? -40 : edge === 1 ? w + 40 : Math.random() * w;
        const sy = edge === 2 ? -40 : edge === 3 ? Math.min(h, innerHeight) + 40 : Math.random() * Math.min(h, innerHeight);
        toOrbit(makeItem(p, sx, sy), 1100);
      } catch (e) { console.warn('읽기 실패', f.name, e); failed++; }
      done++; setCore(`${done}/${todo.length}`, heic ? 'HEIC를 JPG로 바꾸는 중' : '사진을 읽는 중');
    }
  }
  try {
    await Promise.all([worker(), worker()]);
    await sleep(700);
    assignNew(added);
    for (const pl of S.planets.values()) savePlanet(pl);
    for (const p of added) savePhoto(p);
    S.busy = false;
    await runSortAfterIngest();
  } finally { S.busy = false; updateButtons(); }
  const noGps = added.filter(p => !p.gps).length;

async function filesFromDrop(dt) {
  const entries = [...(dt.items || [])].map(i => i.webkitGetAsEntry?.()).filter(Boolean);
  if (!entries.length) return [...dt.files];
  const out = [];
  async function walk(en) {
    if (en.isFile) out.push(await new Promise((r, j) => en.file(r, j)));
    else if (en.isDirectory) { const rd = en.createReader(); let b; do { b = await new Promise((r, j) => rd.readEntries(r, j)); for (const x of b) await walk(x); } while (b.length); }
  }
  for (const en of entries) await walk(en);
  return out;
}

function demoImage(hue, label, i) {
  const c = document.createElement('canvas'); c.width = 320; c.height = 240;
  const g = c.getContext('2d');
  const sk = g.createLinearGradient(0, 0, 0, 240); sk.addColorStop(0, `hsl(${hue},45%,72%)`); sk.addColorStop(1, `hsl(${hue},30%,88%)`);
  g.fillStyle = sk; g.fillRect(0, 0, 320, 240);
  g.fillStyle = `hsl(${hue},18%,${38 + (i % 3) * 8}%)`;
  const bx = 40 + (i * 37) % 120, bw = 120 + (i * 13) % 80, bh = 110 + (i * 29) % 90;
  g.fillRect(bx, 240 - bh, bw, bh);
  g.fillStyle = 'rgba(255,255,255,.7)';
  for (let y = 240 - bh + 14; y < 226; y += 22) for (let x = bx + 12; x < bx + bw - 14; x += 22) g.fillRect(x, y, 10, 12);
  g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(0, 210, 320, 30);
  g.fillStyle = '#fff'; g.font = '600 15px sans-serif'; g.fillText(label, 10, 230);
  return new Promise(r => c.toBlob(r, 'image/jpeg', .85));
}

// ─────────── ZIP 저장: 장소별 폴더 + 목록 ───────────
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
async function makeZip(entries) { // [{name, data:Uint8Array, date:Date}]
  const enc = new TextEncoder(), parts = [], central = []; let offset = 0;
  for (const e of entries) {
    const name = enc.encode(e.name), d = e.date || new Date(), crc = crc32(e.data);
    const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const date = ((Math.max(1980, d.getFullYear()) - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true); lh.setUint32(18, e.data.length, true); lh.setUint32(22, e.data.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(lh, name, e.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true); ch.setUint32(20, e.data.length, true); ch.setUint32(24, e.data.length, true);
    ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
    central.push(ch, name);
    offset += 30 + name.length + e.data.length;
  }
  const cdSize = central.reduce((s, x) => s + x.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end], { type: 'application/zip' });
}
const safe = s => String(s).replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').trim().slice(0, 60) || '이름없음';
async function exportZip() {
  const btn = $('zipBtn'); btn.disabled = true; btn.textContent = 'ZIP 만드는 중…';
  try {
    const entries = [], rows = [['장소', '파일', '원본 파일명', '촬영시각', '위도', '경도', '방향(도)', '건축요소', '기종', '가로', '세로']];
    const meta = { app: 'photo-sorting', exportedAt: new Date().toISOString(), places: [] };
    const planets = orderedPlanets().filter(pl => !pl.demo);
    for (const [i, pl] of planets.entries()) {
      const folder = `${pad(i + 1)}_${safe(pl.name)}`;
      const used = new Set(); const place = { name: pl.name, start: pl.start, end: pl.end, center: pl.center, photos: [] };
      for (const p of photosOf(pl.id)) {
        let base = `${p.takenAt.slice(11, 16).replace(':', '')}_${p.element ? safe(p.element) + '_' : ''}${safe(p.name.replace(/\.[^.]+$/, ''))}`;
        let fn = base + '.jpg', n = 2; while (used.has(fn)) fn = `${base}_${n++}.jpg`; used.add(fn);
        entries.push({ name: `${folder}/${fn}`, data: new Uint8Array(await p.blob.arrayBuffer()), date: new Date(p.takenAt) });
        rows.push([pl.name, `${folder}/${fn}`, p.name, p.takenAt.replace('T', ' '), p.gps?.[1] ?? '', p.gps?.[0] ?? '', p.heading ?? '', p.element || '', p.camera || '', p.w, p.h]);
        place.photos.push({ file: `${folder}/${fn}`, original: p.name, takenAt: p.takenAt, gps: p.gps, heading: p.heading, element: p.element });
      }
      meta.places.push(place);
    }
    const csv = '﻿' + rows.map(r => r.map(v => { const t = String(v); return /[",\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; }).join(',')).join('\r\n');
    entries.push({ name: '사진목록.csv', data: new TextEncoder().encode(csv) });
    entries.push({ name: 'photo-sorting.json', data: new TextEncoder().encode(JSON.stringify(meta, null, 1)) });
    const zip = await makeZip(entries);
    const day = planets[0]?.start?.slice(0, 10) || new Date().toISOString().slice(0, 10);
    await saveFile(`PhotoSorting_${day}.zip`, zip);
  } catch (e) { console.error(e); toast('ZIP을 만들지 못했습니다: ' + e.message, 5000); }
  finally { btn.textContent = 'ZIP 저장'; updateButtons(); }
}
let downloadsCap;
async function saveFile(name, blob) {
  if (downloadsCap === undefined) downloadsCap = window.claude?.use ? await window.claude.use('downloads').catch(() => null) : null;
  if (downloadsCap) {
    try { await downloadsCap.save({ filename: name, data: blob }); toast('저장했습니다'); }
    catch (e) { if (e?.code !== 'declined') toast('저장하지 못했습니다 (' + (e?.code || e?.message) + ')', 5000); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

<title>Photo Sorting</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one night-sky stage. A site's photos gather as a spiral galaxy, Claude looks at each one, then rays carry them out to one planet per architectural element; each planet opens a card listing its photos. Uncertain photos come back as question cards. Single dark look by design. */
:root {
  color-scheme: dark;
  --space: #070A14;
  --space-2: #0D1222;
  --panel: rgba(18, 24, 42, .86);
  --panel-solid: #121A2E;
  --line: rgba(160, 180, 255, .16);
  --ink: #E9ECF7;
  --ink-2: #A9B1CC;
  --ink-3: #6E7898;
  --core: #FFE7B8;
  --accent: #8FA8FF;
  --ask: #FFD27A;
  --display: 'Space Grotesk', 'Noto Sans KR', system-ui, sans-serif;
  --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--space); color: var(--ink); font: 14px/1.5 var(--sans); overflow-x: hidden; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--space); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(var(--space) 60%, rgba(7,10,20,0)); }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; flex-wrap: wrap; }
.brand h1 { margin: 0; font: 700 20px/1 var(--display); letter-spacing: -.01em; }
.site { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.site select, .site input { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 13px; min-width: 0; }
.site input { width: 170px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: rgba(20,27,48,.7); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; transition: border-color .15s, background .15s; }
.btn:hover { border-color: rgba(160,180,255,.45); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #0A0F22; font-weight: 700; }
.btn.primary:hover { background: #A9BCFF; }
.btn.ask { border-color: rgba(255,210,122,.5); color: var(--ask); }
.btn.warn { color: #FFB4B4; }
.btn.small { padding: 4px 10px; font-size: 12px; }
.btn[disabled] { opacity: .4; cursor: default; }

/* stage */
.stage { position: relative; width: 100%; min-height: calc(100vh - 64px); }
#sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#rays { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.fx { position: absolute; inset: 0; pointer-events: none; }
.star { position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 6px; overflow: hidden; will-change: transform;
  box-shadow: 0 0 0 1.5px var(--c, rgba(255,255,255,.7)), 0 0 14px 2px var(--g, rgba(160,180,255,.35)); background: #1A2240; transition: box-shadow .5s; }
.star img { width: 100%; height: 100%; object-fit: cover; display: block; }
.star.scan { box-shadow: 0 0 0 2px var(--core), 0 0 22px 6px rgba(255,210,140,.7); }

.core { position: absolute; transform: translate(-50%, -50%); text-align: center; pointer-events: none; width: 280px; }
.core .num { font: 700 44px/1 var(--display); color: var(--core); text-shadow: 0 0 24px rgba(255,210,140,.55); font-variant-numeric: tabular-nums; }
.core .label { margin-top: 6px; color: var(--ink-2); font-size: 13px; }
.core .site-name { margin-top: 2px; color: var(--ink-3); font-size: 12px; }

.intro { position: absolute; transform: translate(-50%, 0); width: min(460px, calc(100% - 32px)); text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.intro h2 { margin: 0; font: 700 26px/1.25 var(--display); letter-spacing: -.01em; text-wrap: balance; }
.intro p { margin: 0; color: var(--ink-2); text-wrap: balance; }
.intro .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.intro .fine { font-size: 12px; color: var(--ink-3); }

/* planets */
.node { position: absolute; width: 18px; height: 18px; border-radius: 50%; transform: translate(-50%, -50%) scale(0); background: var(--c);
  box-shadow: 0 0 0 4px rgba(255,255,255,.06), 0 0 22px 6px var(--g); transition: transform .45s cubic-bezier(.3,1.6,.5,1); }
.node.on { transform: translate(-50%, -50%) scale(1); }
.node.pulse { animation: pulse .35s ease-out; }
@keyframes pulse { 50% { transform: translate(-50%, -50%) scale(1.35); } }

.card { position: absolute; width: 248px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; transform: scale(.85); transition: opacity .4s, transform .45s cubic-bezier(.2,1.2,.4,1); overflow: hidden; }
.card.on { opacity: 1; transform: none; }
.card::before { content: ""; height: 3px; background: var(--c); display: block; }
.card-head { padding: 10px 12px 8px; display: flex; flex-direction: column; gap: 2px; }
.card-title { display: flex; align-items: center; gap: 8px; }
.card-title .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--g); flex: none; }
.card-title b { flex: 1; min-width: 0; font-size: 15px; }
.card-title .count { font: 500 12px var(--mono); color: var(--ink-2); flex: none; }
.card-meta { font-size: 11.5px; color: var(--ink-3); }
.thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 0 10px 10px; overflow-y: auto; max-height: 172px; }
.thumb { position: relative; aspect-ratio: 1; border-radius: 5px; overflow: hidden; border: 0; padding: 0; cursor: pointer; background: #1A2240; opacity: 0; transform: translateY(6px); transition: opacity .3s, transform .3s; }
.card.on .thumb { opacity: 1; transform: none; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb:hover img { filter: brightness(1.15); }
.thumb .q { position: absolute; right: 2px; top: 2px; width: 15px; height: 15px; border-radius: 50%; background: var(--ask); color: #2A1C00; font: 700 10px/15px var(--sans); text-align: center; }
.thumb .me { position: absolute; left: 2px; bottom: 2px; width: 7px; height: 7px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1.5px rgba(7,10,20,.8); }

/* question sheet */
.ask-sheet { position: fixed; z-index: 45; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(560px, calc(100vw - 32px));
  background: var(--panel-solid); border: 1px solid rgba(255,210,122,.35); border-radius: 18px; box-shadow: 0 16px 50px rgba(0,0,0,.55);
  display: grid; grid-template-columns: 168px 1fr; gap: 16px; padding: 14px; animation: rise .35s cubic-bezier(.2,1.2,.4,1); }
@keyframes rise { from { transform: translate(-50%, 24px); opacity: 0; } }
.ask-img { width: 168px; height: 168px; border-radius: 10px; overflow: hidden; background: #1A2240; cursor: zoom-in; border: 0; padding: 0; }
.ask-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ask-body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ask-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ask-top .n { font: 500 12px var(--mono); color: var(--ask); }
.ask-q { margin: 0; font: 700 17px/1.35 var(--sans); }
.ask-guess { margin: 0; font-size: 12.5px; color: var(--ink-2); }
.ask-guess b { color: var(--ask); font-weight: 700; }
.ask-foot { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }

/* lightbox */
.lb { position: fixed; inset: 0; z-index: 50; background: rgba(4,6,12,.86); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  display: grid; grid-template-columns: 1fr 300px; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.lb-img { display: flex; align-items: center; justify-content: center; padding: 24px; min-width: 0; min-height: 0; position: relative; }
.lb-img img { max-width: 100%; max-height: calc(100vh - 48px); object-fit: contain; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
.lb-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: rgba(18,24,42,.8); cursor: pointer; font-size: 18px; }
.lb-nav.prev { left: 16px; } .lb-nav.next { right: 16px; }
.lb-side { background: var(--panel-solid); border-left: 1px solid var(--line); padding: 20px 18px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.lb-side h3 { margin: 0; font-size: 15px; word-break: break-all; }
.lb-close { align-self: flex-end; }
.ai-box { background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font-size: 12.5px; color: var(--ink-2); }
.ai-box b { color: var(--ink); }
dl.meta { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12.5px; }
dl.meta dt { color: var(--ink-3); }
dl.meta dd { margin: 0; font-family: var(--mono); font-size: 12px; color: var(--ink); word-break: break-all; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--ink-3); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 13px; cursor: pointer; font-size: 13.5px; color: var(--ink); }
.chip .k { font: 500 10.5px var(--mono); color: var(--ink-3); margin-right: 4px; }
.chip.guess { border-color: rgba(255,210,122,.6); }
.chip.on { background: var(--accent); border-color: var(--accent); color: #0A0F22; font-weight: 700; }
.chip.on .k { color: #2A3570; }
.add-el { display: flex; gap: 6px; }
.add-el input { flex: 1; min-width: 0; font-size: 13px; background: var(--space-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; }
.hint { font-size: 11.5px; color: var(--ink-3); }

.toast { position: fixed; left: 50%; top: calc(72px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 60; background: var(--panel-solid); border: 1px solid var(--line);
  padding: 9px 16px; border-radius: 999px; font-size: 13px; max-width: calc(100vw - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.4); }
.drop { position: fixed; inset: 0; z-index: 40; border: 2px dashed var(--accent); background: rgba(143,168,255,.08); display: flex; align-items: center; justify-content: center; pointer-events: none; }
.drop p { font: 700 18px var(--display); background: var(--panel-solid); padding: 12px 22px; border-radius: 999px; border: 1px solid var(--line); }

/* map: globe → 3D buildings → mapping */
.map { position: fixed; inset: 0; z-index: 35; background: #03050B; padding-top: env(safe-area-inset-top, 0px); }
.map canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.map .veil { position: absolute; inset: 0; background: #03050B; opacity: 0; pointer-events: none; transition: opacity .45s; }
.map .veil.on { opacity: 1; }
.map-top { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px));
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
.map-top > * { pointer-events: auto; }
.map-title { font: 700 16px var(--display); margin-right: auto; text-shadow: 0 1px 8px #000; }
.map-title small { display: block; font: 400 12px var(--mono); color: var(--ink-2); }
.map-status { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
.map-status b { display: block; font: 700 22px var(--display); color: var(--core); text-shadow: 0 0 20px rgba(255,210,140,.5); }
.map-status span { color: var(--ink-2); font-size: 13px; }
.map-hint { position: absolute; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: rgba(18,26,46,.92); border: 1px solid rgba(255,210,122,.45);
  color: var(--ask); padding: 7px 14px; border-radius: 999px; font-size: 13px; max-width: calc(100vw - 32px); text-align: center; }
.strip { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(rgba(3,5,11,0), rgba(3,5,11,.92) 30%); display: flex; flex-direction: column; gap: 8px; }
.strip-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.strip-head b { color: var(--ink); }
.strip-list { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.sp { position: relative; flex: none; width: 64px; height: 64px; border-radius: 8px; overflow: hidden; border: 2px solid var(--c, transparent); padding: 0; cursor: pointer; background: #1A2240; }
.sp img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sp.on { outline: 2px solid #fff; outline-offset: 2px; }
.sp .st { position: absolute; right: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; font: 700 9px/14px var(--sans); text-align: center; background: rgba(7,10,20,.85); color: var(--ink-3); }
.sp .st.ok { background: #6FE3B4; color: #04241A; }
.sp .st.gps { background: rgba(255,255,255,.85); color: #222; }
.minfo { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(64px + env(safe-area-inset-top, 0px)); width: 270px; background: rgba(18,26,46,.94); border: 1px solid var(--line);
  border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.minfo img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; cursor: zoom-in; }
.minfo h4 { margin: 0; font-size: 14px; color: var(--ink); }
.minfo .row { display: flex; gap: 6px; flex-wrap: wrap; }
.minfo .bld { border-top: 1px solid var(--line); padding-top: 8px; }
.minfo .bld b { color: var(--ink); }

@media (max-width: 760px) {
  .minfo { left: 16px; right: 16px; width: auto; top: auto; bottom: 120px; max-height: 40vh; overflow-y: auto; }
  .minfo img { height: 110px; }
}
@media (max-width: 760px) {
  .bar { position: relative; top: 0; background: var(--space); }
  .btn { padding: 6px 11px; }
  .site input { width: 130px; }
  .ask-sheet { grid-template-columns: 96px 1fr; gap: 12px; }
  .ask-img { width: 96px; height: 96px; }
  .ask-q { font-size: 15px; }
  .lb { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; overflow-y: auto; }
  .lb-img { padding: 12px; }
  .lb-img img { max-height: 52vh; }
  .lb-side { border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); }
}
@media (prefers-reduced-motion: reduce) {
  .card, .thumb, .node { transition: none; }
  .ask-sheet { animation: none; }
}
</style>

<header class="bar" id="bar">
  <div class="brand">
    <h1>Photo Sorting</h1>
    <div class="site" id="siteBox" hidden>
      <select id="siteSel" aria-label="답사 고르기"></select>
      <input id="siteName" aria-label="답사 장소 이름" maxlength="40">
    </div>
  </div>
  <div class="actions">
    <button class="btn ask" id="askBtn" type="button" hidden>질문 0</button>
    <button class="btn" id="replayBtn" type="button" disabled>다시 보기</button>
    <button class="btn" id="mapBtn" type="button" hidden>지도</button>
    <button class="btn" id="zipBtn" type="button" disabled>ZIP 저장</button>
    <button class="btn" id="newSiteBtn" type="button" hidden>새 답사</button>
    <button class="btn warn" id="clearBtn" type="button" hidden>이 답사 지우기</button>
    <label class="btn primary" for="fileIn">사진 올리기</label>
    <input id="fileIn" type="file" accept="image/*,.heic,.heif" multiple hidden>
  </div>
</header>

<main class="stage" id="stage">
  <canvas id="sky" aria-hidden="true"></canvas>
  <svg id="rays" aria-hidden="true"></svg>
  <div id="planets"></div>
  <div class="fx" id="fx"></div>
  <div class="core" id="core" hidden><div class="num" id="coreNum">0</div><div class="label" id="coreLabel"></div><div class="site-name" id="coreSite"></div></div>
  <div class="intro" id="intro">
    <h2>한 장소의 답사 사진을 놓으면, 건축요소별 행성으로 나뉩니다</h2>
    <p>사진이 은하수로 모이면 Claude가 한 장씩 보고 입구·창·계단으로 나눕니다. 애매한 사진은 질문으로 물어봅니다. 가로 2000px보다 큰 사진은 2000px로 줄여 보관합니다.</p>
    <div class="row">
      <label class="btn primary" for="fileIn">사진 올리기</label>
      <button class="btn" id="demoBtn" type="button">예시로 보기</button>
    </div>
    <p class="fine">사진 파일은 이 브라우저에 저장됩니다. 분류할 때만 작게 줄인 사진을 Claude에게 보여 주며, 처음 한 번 허용을 묻습니다.</p>
  </div>
</main>

<section class="ask-sheet" id="ask" hidden aria-live="polite" aria-label="분류 질문">
  <button class="ask-img" id="askImgBtn" type="button" aria-label="크게 보기"><img id="askImg" alt=""></button>
  <div class="ask-body">
    <div class="ask-top"><span class="n" id="askN"></span><button class="btn small" id="askClose" type="button">나중에</button></div>
    <p class="ask-q">이 사진은 어떤 건축요소인가요?</p>
    <p class="ask-guess" id="askGuess"></p>
    <div class="chips" id="askChips"></div>
    <div class="ask-foot"><button class="btn small" id="askSkip" type="button">건너뛰기</button></div>
  </div>
</section>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="사진 보기">
  <div class="lb-img">
    <img id="lbImg" alt="">
    <button class="lb-nav prev" id="lbPrev" type="button" aria-label="이전 사진">‹</button>
    <button class="lb-nav next" id="lbNext" type="button" aria-label="다음 사진">›</button>
  </div>
  <aside class="lb-side">
    <button class="btn lb-close" id="lbClose" type="button">닫기 · Esc</button>
    <h3 id="lbName"></h3>
    <div class="ai-box" id="lbAi" hidden></div>
    <div class="field">건축요소 <span class="hint">숫자키로도 지정</span>
      <div class="chips" id="lbChips"></div>
      <form class="add-el" id="addElForm"><input id="addElInput" placeholder="요소 추가 (예: 지붕)" maxlength="12"><button class="btn" type="submit">추가</button></form>
    </div>
    <dl class="meta" id="lbMeta"></dl>
    <p class="hint">← → 사진 넘기기</p>
  </aside>
</div>

<section class="map" id="map" hidden aria-label="답사 지도">
  <canvas id="gl"></canvas>
  <div class="veil" id="veil"></div>
  <div class="map-top">
    <div class="map-title" id="mapTitle"></div>
    <button class="btn small" id="gpsAllBtn" type="button" hidden>GPS 위치 모두 쓰기</button>
    <button class="btn small" id="mapBack" type="button">은하로 돌아가기</button>
  </div>
  <div class="map-status" id="mapStatus"><b id="mapStatusB"></b><span id="mapStatusS"></span></div>
  <div class="map-hint" id="mapHint" hidden></div>
  <aside class="minfo" id="minfo" hidden></aside>
  <div class="strip" id="strip" hidden>
    <div class="strip-head" id="stripHead"></div>
    <div class="strip-list" id="stripList"></div>
  </div>
</section>

<div class="drop" id="drop" hidden><p>놓으면 은하수로 모입니다</p></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script>
(() => {
'use strict';

// ─────────── 설정 ───────────
const MAX_W = 2000;          // 저장 이미지 가로 최대 px
const THUMB = 220;           // 애니메이션·목록용
const AI_SIDE = 768;         // Claude에게 보여 줄 크기
const SURE = 0.6;            // 이보다 확신이 낮으면 질문으로
const DEFAULT_ELEMENTS = ['입구', '창', '계단'];

// ─────────── 저장 (IndexedDB, 이 브라우저 안) ───────────
const DB = (() => {
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open('photo-sorting', 2);
        r.onupgradeneeded = () => { for (const s of ['photos', 'planets', 'settings', 'sites']) if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
    return dbp;
  }
  async function run(store, mode, fn) {
    try {
      const db = await open();
      return await new Promise((res, rej) => {
        const tx = db.transaction(store, mode); const out = fn(tx.objectStore(store));
        tx.oncomplete = () => res(out && 'result' in out ? out.result : undefined); tx.onerror = () => rej(tx.error);
      });
    } catch (e) { console.warn('저장소 사용 불가', e); return undefined; }
  }
  return {
    put: (s, k, v) => run(s, 'readwrite', o => o.put(v, k)),
    del: (s, k) => run(s, 'readwrite', o => o.delete(k)),
    get: (s, k) => run(s, 'readonly', o => o.get(k)),
    all: s => run(s, 'readonly', o => o.getAll())
  };
})();
const savePhoto = p => (p.demo ? null : DB.put('photos', p.id, p));

}

}

let samplerP = null;

let aiOff = null; // 사용 불가 사유가 생기면 이번 화면에서는 다시 묻지 않는다

  const cats = [...S.elements, OTHER];
  let done = 0;
  for (let i = 0; i < list.length; i += sm.max) {
    const batch = list.slice(i, i + sm.max);
    const prompt = `건축물 답사에서 찍은 사진 ${batch.length}장입니다. 사진 순서대로 1부터 ${batch.length}까지 번호를 매깁니다.
각 사진이 주로 보여 주는 건축요소를 다음 중 정확히 하나로 고르세요: ${cats.join(', ')}.
- 사진의 중심 대상으로 판단합니다. 건물 전경처럼 어느 요소도 중심이 아니면 "${OTHER}".
- confidence는 0부터 1 사이 숫자로, 확실하지 않으면 낮게 주세요.
- note는 사진에 보이는 것을 한국어 20자 이내로.
JSON 배열만 답하세요. 예: [{"n":1,"element":"${cats[0]}","confidence":0.82,"note":"주출입구 캐노피"}]`;
    try {
      const out = await sm.s.json(prompt, { images: batch.map(p => p.ai || p.thumb), modelTier: 'quick' });
      const arr = Array.isArray(out) ? out : [];
      batch.forEach((p, k) => {
        const r = arr.find(x => Number(x?.n) === k + 1) || arr[k];
        const el = typeof r?.element === 'string' ? r.element.trim() : '';
        const conf = Math.max(0, Math.min(1, Number(r?.confidence) || 0));
        p.aiElement = cats.includes(el) ? el : null; p.aiConf = conf; p.aiNote = typeof r?.note === 'string' ? r.note.slice(0, 40) : null;
        if (p.aiElement && conf >= SURE) { p.element = p.aiElement; p.by = 'ai'; p.ask = false; }
        else markAsk(p);
      });
    } catch (e) {
      console.warn('분류 실패', e);
      for (const p of batch) markAsk(p);
      if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed', 'images_unavailable'].includes(e?.code)) aiOff = e.code;
      if (e?.code === 'rate_limited') aiOff = 'rate_limited';

const sky = $('sky'), ctx = sky.getContext('2d');
let W = 0, H = 0, DPR = 1, galaxy = { x: 0, y: 0, r: 200 }, spin = 0.05, glow = 0.35;
const stars = Array.from({ length: 220 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.2 + .2, p: Math.random() * 6.28, s: .5 + Math.random() * 1.5 }));
const dust = Array.from({ length: 520 }, (_, i) => {
  const u = Math.pow(Math.random(), .7);
  return { arm: i % 2, u, off: (Math.random() - .5) * .55 * (1.1 - u), hue: Math.random() < .25 ? 38 : 222 + Math.random() * 40, a: .25 + Math.random() * .55, r: Math.random() * 1.4 + .3 };
});

let skyAngle = 0;
function drawSky(t, dt) {

  bg.addColorStop(0, '#111A36'); bg.addColorStop(1, '#070A14');

// ─────────── 날아다니는 사진 ───────────
const items = new Map();

function layoutFor(n) {

  const cardW = Math.min(248, w - 32), cardH = 262, gap = 16;
  if (w >= 980 && n <= 6) {
    const perSide = Math.ceil(n / 2);

    const side = Array.from({ length: n }, (_, i) => i % 2 === 0 ? 'left' : 'right');
    const slots = { right: side.filter(s => s === 'right').length, left: side.filter(s => s === 'left').length }, idx = { right: 0, left: 0 };
    const cards = side.map(sd => {
      const k = slots[sd], j = idx[sd]++;
      const top = cy - (k * (cardH + gap) - gap) / 2 + j * (cardH + gap);
      const left = sd === 'right' ? w - cardW - 28 : 28;

    });
    return { h, cx, cy, r: Math.max(110, Math.min((w - 2 * (cardW + 80)) / 2, cy - 40, 320)), cardW, cards };
  }
  const cols = Math.max(1, Math.floor((w - 32 + gap) / (cardW + gap))), rows = Math.ceil(n / cols), topArea = 300;
  const gridW = cols * cardW + (cols - 1) * gap, x0 = (w - gridW) / 2;
  const cards = Array.from({ length: n }, (_, i) => {
    const left = x0 + (i % cols) * (cardW + gap), top = topArea + Math.floor(i / cols) * (cardH + 34 + gap) + 34;
    return { left, top, node: [left + cardW / 2, top - 16] };

}

// ─────────── 사진 올리기 → 읽기 → Claude 판단 → 행성 ───────────
async function ingest(files, demoList) {
  if (S.busy) { toast('지금 분류가 끝나면 올려 주세요'); return; }
  let todo = [];
  if (!demoList) {
    files = files.filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|webp|heic|heif)$/i.test(f.name));
    if (!files.length) { toast('사진 파일이 없습니다'); return; }
    if ([...S.photos.values()].some(p => p.demo)) dropDemo();
    const seen = new Set([...S.photos.values()].map(p => p.sig));
    todo = files.filter(f => !seen.has(`${f.name}|${f.size}|${f.lastModified}`));
    if (!todo.length) { toast('이미 올린 사진입니다'); return; }
  }
  // 한 번 올리기 = 한 장소의 답사. 지금 답사에 사진이 있으면 새 답사로 시작한다.
  const cur = S.sites.get(S.siteId);
  if (!cur || (!demoList && sitePhotos().length) || (demoList && !cur.demo)) newSite(!!demoList);
  const site = S.sites.get(S.siteId);
  S.busy = true; closeAsk(); updateButtons(); $('intro').hidden = true;
  if (planetsEl.childElementCount) await gatherExisting(); else { const L = layoutFor(4); setStageHeight(L.h); galaxy = { x: L.cx, y: L.cy, r: L.r }; }
  spin = .18; glow = .7;
  const total = demoList ? demoList.length : todo.length;
  let done = 0, failed = 0, heic = 0, bigger = 0, saved = 0;
  setCore(`0/${total}`, '사진을 읽는 중');
  const added = [];
  const enter = p => {
    const w = stage.clientWidth, h = Math.min(stage.clientHeight, innerHeight), a = Math.random() * 6.283;
    toOrbit(makeItem(p, w / 2 + Math.cos(a) * w * .7, h / 2 + Math.sin(a) * h * .7), 1100);
  };
  try {
    if (demoList) {
      for (const p of demoList) { p.siteId = site.id; S.photos.set(p.id, p); added.push(p); enter(p); done++; setCore(`${done}/${total}`, '예시 사진을 읽는 중'); await sleep(70); }
    } else {
      const queue = [...todo];
      const worker = async () => {
        while (queue.length) {
          const f = queue.shift();
          try {
            if (isHeic(f)) heic++;
            const p = await processFile(f, site.id);
            if (p.origW > MAX_W) { bigger++; saved += Math.max(0, p.origSize - p.size); }
            S.photos.set(p.id, p); added.push(p); savePhoto(p); enter(p);
          } catch (e) { console.warn('읽기 실패', f.name, e); failed++; }
          done++; setCore(`${done}/${total}`, heic ? 'HEIC를 JPG로 바꾸는 중' : '사진을 읽는 중');
        }
      };
      await Promise.all([worker(), worker()]);
    }
    refreshSite(site); saveSite(site); renderSiteBar();
    await sleep(500);
    // Claude가 사진을 본다: 보고 있는 사진이 빛난다
    setCore(`0/${added.length}`, '건축요소를 살펴보는 중');
    spin = .22;
    let scanTimer = setInterval(() => {
      for (const it of items.values()) it.el.classList.remove('scan');
      const arr = [...items.values()]; for (let k = 0; k < 3 && arr.length; k++) arr[Math.random() * arr.length | 0].el.classList.add('scan');
    }, 380);
    let res;
    try {
      res = demoList ? await demoClassify(added, n => setCore(`${n}/${added.length}`, '건축요소를 살펴보는 중'))
                     : await classify(added, n => setCore(`${n}/${added.length}`, '건축요소를 살펴보는 중'));
    } finally { clearInterval(scanTimer); }
    for (const p of added) savePhoto(p);
    await sortShow();
    S.busy = false; clearItems(); renderPlanets();
    const asks = added.filter(p => p.ask).length;
    const msg = [`${added.length}장을 정리했습니다`];
    if (bigger) msg.push(`${bigger}장은 가로 ${MAX_W}px로 줄임 (${(saved / 1048576).toFixed(1)}MB 절약)`);
    if (!res.used) msg.push(res.reason === 'not_granted' ? 'Claude 사용을 허용하지 않아 직접 분류합니다' : res.reason === 'rate_limited' ? 'Claude 사용량이 많아 나머지는 직접 분류합니다' : '이 화면에서는 Claude가 사진을 볼 수 없어 직접 분류합니다');
    if (failed) msg.push(`읽지 못한 사진 ${failed}장`);
    toast(msg.join(' · '), 5000);
    if (asks) openAsk();
    else if (site.center) setTimeout(() => { if (!S.busy && !M3.on && $('lb').hidden) openMap(); }, 2200);
  } finally { S.busy = false; clearItems(); updateButtons(); }
}

async function filesFromDrop(dt) {
  const entries = [...(dt.items || [])].map(i => i.webkitGetAsEntry?.()).filter(Boolean);
  if (!entries.length) return [...dt.files];
  const out = [];
  async function walk(en) {

    else if (en.isDirectory) { const rd = en.createReader(); let b; do { b = await new Promise((r, j) => rd.readEntries(r, j)); for (const x of b) await walk(x); } while (b.length); }

}

function demoImage(kind, i) {
  const c = document.createElement('canvas'); c.width = 320; c.height = 240;
  const g = c.getContext('2d');
  const sk = g.createLinearGradient(0, 0, 0, 240); sk.addColorStop(0, '#9FB6D8'); sk.addColorStop(1, '#DCE4EE');
  g.fillStyle = sk; g.fillRect(0, 0, 320, 240);
  g.fillStyle = `hsl(28,14%,${46 + (i % 3) * 6}%)`; g.fillRect(0, 40, 320, 200);
  g.fillStyle = '#2B2F38'; g.strokeStyle = '#2B2F38';
  if (kind === '입구') { g.fillRect(120, 110, 80, 130); g.fillStyle = '#C9B48A'; g.fillRect(100, 96, 120, 14); }
  else if (kind === '창') { g.fillStyle = '#E9F1FA'; for (let x = 40; x < 300; x += 70) for (let y = 70; y < 220; y += 70) { g.fillRect(x, y, 44, 48); g.fillStyle = '#2B2F38'; g.fillRect(x + 21, y, 2, 48); g.fillStyle = '#E9F1FA'; } }
  else if (kind === '계단') { g.fillStyle = '#C8CCD4'; for (let s = 0; s < 8; s++) g.fillRect(60 + s * 24, 220 - s * 20, 200 - s * 24, 20); }
  else { g.fillStyle = '#7A6E62'; g.fillRect(70 + i % 40, 70, 180, 170); }
  g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(0, 214, 320, 26);
  g.fillStyle = '#fff'; g.font = '600 14px sans-serif'; g.fillText(`예시 ${i}`, 10, 232);
  return new Promise(r => c.toBlob(r, 'image/jpeg', .85));
}

      cam.position.copy(llVec(cl, ca, dist));
      cam.up.set(0, 1, 0);
      cam.lookAt(new THREE.Vector3().lerpVectors(new THREE.Vector3(), pin, Math.min(1, e * 1.2)));
      dot.scale.setScalar(1 + .5 * Math.sin(now / 160));
      M3.gl.render(scene, cam);
      if (k < 1) M3.raf = requestAnimationFrame(step); else res();
    };
    M3.raf = requestAnimationFrame(step);
  });
  scene.traverse(o => { o.geometry?.dispose?.(); o.material?.dispose?.(); });
}

// 2) 3D 건물: 바깥쪽부터 차례로 솟아오른다
function buildLocal(blds) {
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x070B16); scene.fog = new THREE.Fog(0x070B16, 650, 1500);
  const cam = new THREE.PerspectiveCamera(45, 1, 1, 5000); M3.cam = cam; M3.scene = scene; M3.fit();
  scene.add(new THREE.HemisphereLight(0xA9BCFF, 0x141A2C, .95));
  const sun = new THREE.DirectionalLight(0xFFF1DD, .75); sun.position.set(300, 600, 200); scene.add(sun);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshLambertMaterial({ color: 0x0E1529 }));
  ground.rotation.x = -Math.PI / 2; ground.name = 'ground'; scene.add(ground); M3.ground = ground;
  const grid = new THREE.GridHelper(1000, 40, 0x2A3A6A, 0x18223F); grid.position.y = .05; scene.add(grid);
  const ring = new THREE.Mesh(new THREE.RingGeometry(448, 452, 96), new THREE.MeshBasicMaterial({ color: 0x2A3A6A, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = .06; scene.add(ring);
  // 건물을 한 덩어리로 합친다 (그리는 횟수를 줄이려고). 꼭짓점마다 주인 건물 번호를 기억해 클릭에 쓴다.
  M3.blds = blds;
  const pos = [], nor = [], col = [], del = [], own = [];
  const lo = new THREE.Color(0x1F2A48), hi = new THREE.Color(0xA9B8E6), c = new THREE.Color();
  blds.forEach((b, i) => {
    b.H = b.h > 0 ? b.h : Math.max(1, b.floors) * 3.3;
    let shape;
    try { shape = new THREE.Shape(b.pts.map(p => new THREE.Vector2(p[0], p[1]))); } catch (e) { return; }
    const g = new THREE.ExtrudeGeometry(shape, { depth: b.H, bevelEnabled: false });
    g.rotateX(-Math.PI / 2);
    const P = g.attributes.position.array, N = g.attributes.normal.array;
    c.copy(lo).lerp(hi, Math.min(1, b.H / 70));
    const d = Math.hypot(b.pts[0][0], b.pts[0][1]) / 450;
    const delay = (1 - d) * 1.1 + Math.random() * .25;
    for (let k = 0; k < P.length; k += 3) { pos.push(P[k], P[k + 1], P[k + 2]); nor.push(N[k], N[k + 1], N[k + 2]); col.push(c.r, c.g, c.b); del.push(delay); own.push(i); }
    g.dispose();
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.setAttribute('aDelay', new THREE.Float32BufferAttribute(del, 1));
  M3.owner = own;
  const uT = { value: reduceMotion ? 9 : 0 }; M3.uT = uT;
  const mat = new THREE.MeshLambertMaterial({ vertexColors: true });
  mat.onBeforeCompile = sh => {
    sh.uniforms.uT = uT;
    sh.vertexShader = 'uniform float uT;\nattribute float aDelay;\n' + sh.vertexShader.replace('#include <begin_vertex>',
      'vec3 transformed = vec3(position); float kk = clamp((uT - aDelay) / .9, 0., 1.); kk = 1. - pow(1. - kk, 3.); transformed.y *= max(kk, .001);');
  };
  M3.mesh = new THREE.Mesh(geo, mat); scene.add(M3.mesh);
  M3.hl = new THREE.Group(); scene.add(M3.hl);
  M3.shots = new THREE.Group(); scene.add(M3.shots);
  M3.preview = new THREE.Group(); scene.add(M3.preview);
  drawShots();
  // 카메라: 위에서 내려다보다가 비스듬히
  const ctl = new THREE.OrbitControls(cam, $('gl'));
  ctl.enableDamping = true; ctl.maxPolarAngle = 1.45; ctl.minDistance = 25; ctl.maxDistance = 1500; ctl.target.set(0, 0, 0);
  M3.ctl = ctl;
  const from = new THREE.Vector3(0, 1100, 1), to = new THREE.Vector3(-230, 250, 360), t0 = performance.now(), dur = reduceMotion ? 1 : 2600;
  cam.position.copy(from); cam.lookAt(0, 0, 0);
  cancelAnimationFrame(M3.raf);
  const loop = now => {
    const k = Math.min(1, (now - t0) / dur);
    if (k < 1) { const e = 1 - Math.pow(1 - k, 3); cam.position.lerpVectors(from, to, e); cam.lookAt(0, 0, 0); }
    else ctl.update();
    if (uT.value < 9) uT.value = (now - t0) / 1000 * 1.15;
    M3.gl.render(scene, cam);
    if (M3.on) M3.raf = requestAnimationFrame(loop);
  };
  M3.raf = requestAnimationFrame(loop);
}

// 사진 표시: 찍은 자리(점) + 바라본 방향(부채꼴) + 공중의 사진
const texCache = new Map();
function texFor(p) { if (!texCache.has(p.id)) { const t = new THREE.TextureLoader().load(thumbUrl(p)); texCache.set(p.id, t); } return texCache.get(p.id); }
function fanMesh(heading, color, opacity, r = 30, fov = 55) {
  const th = (90 - heading - fov / 2) * D2R;
  const g = new THREE.CircleGeometry(r, 24, th, fov * D2R); g.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false, side: THREE.DoubleSide }));
  m.position.y = .4; return m;
}
function shotPos(p) { return p.shot ? toLocal([p.shot.x, p.shot.y]) : p.gps ? toLocal(TM.fwd(p.gps[0], p.gps[1])) : null; }
function drawShots() {
  const G = M3.shots; G.clear();
  for (const p of sitePhotos()) {
    const xz = shotPos(p); if (!xz) continue;
    const placed = !!p.shot, on = p.id === M3.sel, color = placed ? elColor(p) : '#7E879F';
    const g = new THREE.Group(); g.position.set(xz[0], 0, xz[1]); g.userData.photo = p.id;
    const dot = new THREE.Mesh(new THREE.CylinderGeometry(on ? 3 : 2, on ? 3 : 2, 1, 20), new THREE.MeshBasicMaterial({ color: on ? '#ffffff' : color }));
    dot.position.y = .5; dot.userData.photo = p.id; g.add(dot);
    if (placed && p.shot.heading != null) { const f = fanMesh(p.shot.heading, color, on ? .5 : .28); f.userData.photo = p.id; g.add(f); }
    if (placed || on) {
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: texFor(p), depthTest: true }));
      const s = on ? 22 : 13; sp.scale.set(s, s * .75, 1); sp.position.y = on ? 26 : 18; sp.userData.photo = p.id; g.add(sp);
      const ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, sp.position.y - s * .375, 0)]), new THREE.LineBasicMaterial({ color }));
      g.add(ln);
    }
    G.add(g);
  }
}
function highlightBuilding(i) {
  M3.hl.clear(); if (i == null || !M3.blds[i]) return;
  const b = M3.blds[i];
  const g = new THREE.ExtrudeGeometry(new THREE.Shape(b.pts.map(p => new THREE.Vector2(p[0], p[1]))), { depth: b.H + .3, bevelEnabled: false }); g.rotateX(-Math.PI / 2);
  M3.hl.add(new THREE.LineSegments(new THREE.EdgesGeometry(g), new THREE.LineBasicMaterial({ color: 0xFFD27A })));
  g.dispose();
}

// 사진 고르기 → 찍은 자리 클릭 → 바라본 쪽 클릭
const ray = () => new THREE.Raycaster();
function ndc(e) { const r = $('gl').getBoundingClientRect(); return new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); }
function groundAt(e) { const rc = ray(); rc.setFromCamera(ndc(e), M3.cam); const h = rc.intersectObject(M3.ground)[0]; return h ? [h.point.x, h.point.z] : null; }
function selectPhoto(id, place) {
  M3.sel = id; const p = S.photos.get(id);
  M3.mode = place || !p.shot ? 'pos' : null;
  M3.preview.clear(); drawShots(); renderStrip(); renderMinfo();
  highlightBuilding(p.shot?.target?.i ?? null);
  if (M3.mode === 'pos') hint('이 사진을 찍은 자리를 클릭하세요 · Esc 취소');
  else hint(null);
  const xz = shotPos(p); if (xz && M3.ctl) { M3.ctl.target.set(xz[0], 0, xz[1]); }
}
function onMove(e) {
  if (M3.mode !== 'dir' || !M3.cam) return;
  const g = groundAt(e); if (!g) return;
  const [x, z] = M3.pending, hdg = (Math.atan2(g[0] - x, -(g[1] - z)) / D2R + 360) % 360;
  M3.pendingH = hdg;
  M3.preview.clear();
  const f = fanMesh(hdg, '#FFD27A', .45, 40); f.position.x = x; f.position.z = z; M3.preview.add(f);
  const t = targetBuilding(x, z, hdg); highlightBuilding(t?.i ?? null);
}
function onPick(e) {
  if (!M3.cam) return;
  if (M3.mode === 'pos') {
    const g = groundAt(e); if (!g) return;
    M3.pending = g; M3.mode = 'dir';
    M3.preview.clear();
    const d = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 1, 20), new THREE.MeshBasicMaterial({ color: '#FFD27A' })); d.position.set(g[0], .5, g[1]); M3.preview.add(d);
    hint('이제 사진에서 바라본 쪽을 클릭하세요');
    return;
  }
  if (M3.mode === 'dir') {
    const p = S.photos.get(M3.sel); const [x, z] = M3.pending; const hdg = Math.round(M3.pendingH ?? 0);
    const [X, Y] = toWorld(x, z), [lon, lat] = TM.inv(X, Y);
    const t = targetBuilding(x, z, hdg);
    p.shot = { x: +X.toFixed(2), y: +Y.toFixed(2), lon: +lon.toFixed(7), lat: +lat.toFixed(7), heading: hdg, by: 'user', at: new Date().toISOString(),
      target: t ? { i: t.i, addr: t.b.addr, use: t.b.use, floors: t.b.floors, base: t.b.base, year: t.b.year, height: t.b.h || null, dist: +t.d.toFixed(1) } : null };
    savePhoto(p); M3.mode = null; M3.preview.clear();
    hint(t ? `저장했습니다 · 바라본 건물: ${t.b.addr || ''} ${t.b.use || ''}`.trim() : '저장했습니다', 3500);
    const next = sitePhotos().find(q => !q.shot && q.id !== p.id);
    drawShots(); renderStrip(); renderMinfo();
    return;
  }
  // 고르는 중이 아니면: 사진 표시를 누르면 그 사진, 건물을 누르면 건물 정보
  const rc = ray(); rc.setFromCamera(ndc(e), M3.cam);
  const hs = rc.intersectObjects(M3.shots.children, true).find(h => h.object.userData.photo);
  if (hs) { selectPhoto(hs.object.userData.photo); return; }
  const hb = M3.mesh && rc.intersectObject(M3.mesh)[0];
  if (hb) { const i = M3.owner[hb.face.a]; highlightBuilding(i); renderMinfo(i); }
}
// 찍은 자리에서 바라본 방향으로 150m 안에서 처음 만나는 건물
function targetBuilding(x, z, hdg) {
  const dx = Math.sin(hdg * D2R), dz = -Math.cos(hdg * D2R);
  let best = null;
  M3.blds.forEach((b, i) => {
    const P = b.pts; if (Math.hypot(P[0][0] - x, -P[0][1] - z) > 260) return;
    for (let k = 0; k < P.length; k++) {
      const ax = P[k][0], az = -P[k][1], bx = P[(k + 1) % P.length][0], bz = -P[(k + 1) % P.length][1];
      const ex = bx - ax, ez = bz - az, den = dx * ez - dz * ex; if (Math.abs(den) < 1e-9) continue;
      const t = ((ax - x) * ez - (az - z) * ex) / den, s = ((ax - x) * dz - (az - z) * dx) / den;
      if (t > .5 && t < 150 && s >= 0 && s <= 1 && (!best || t < best.d)) best = { i, b, d: t };
    }
  });
  return best;
}
function renderStrip() {
  const L = sitePhotos(), done = L.filter(p => p.shot).length, gps = L.filter(p => !p.shot && p.gps).length;
  $('stripHead').innerHTML = `<b>매핑 ${done} / ${L.length}</b><span>사진을 고르고 지도에서 찍은 자리 → 바라본 쪽을 클릭</span>`;
  $('gpsAllBtn').hidden = !gps; $('gpsAllBtn').textContent = `GPS 위치 모두 쓰기 (${gps})`;
  $('stripList').innerHTML = L.map(p => `<button type="button" class="sp ${p.id === M3.sel ? 'on' : ''}" data-mp="${p.id}" style="--c:${elColor(p)}" title="${esc(p.element || '미분류')} · ${esc(p.name)}"><img alt="" src="${thumbUrl(p)}"><span class="st ${p.shot ? 'ok' : p.gps ? 'gps' : ''}">${p.shot ? '✓' : p.gps ? 'G' : '–'}</span></button>`).join('');
  $('stripList').querySelector('.sp.on')?.scrollIntoView({ inline: 'nearest', block: 'nearest' });
}
function renderMinfo(bi) {
  const box = $('minfo');
  if (bi != null && M3.mode == null && (!M3.sel || bi !== S.photos.get(M3.sel)?.shot?.target?.i)) {
    const b = M3.blds[bi];
    box.hidden = false;
    box.innerHTML = `<h4>${esc(b.addr || '주소 없음')}</h4><div>${esc(b.use || '용도 정보 없음')}</div>
      <div>지상 ${b.floors}층${b.base ? ` · 지하 ${b.base}층` : ''} · 높이 ${b.h ? b.h + 'm' : `약 ${Math.round(b.H)}m (층수로 계산)`}</div>
      <div>${b.year ? `사용승인 ${b.year}년` : '사용승인연도 없음'}</div><div class="row"><button class="btn small" type="button" data-mi="close">닫기</button></div>`;
    return;
  }
  const p = S.photos.get(M3.sel); if (!p) { box.hidden = true; return; }
  box.hidden = false;
  const t = p.shot?.target;
  box.innerHTML = `<img src="${thumbUrl(p)}" alt="${esc(p.name)}" data-mi="big">
    <h4>${esc(p.element || '미분류')} · ${esc(p.name)}</h4>
    <div>${p.shot ? `찍은 자리 지정됨 · 방향 ${p.shot.heading}°` : p.gps ? 'GPS 위치만 있음 (회색 점)' : '위치 정보 없음'}</div>
    ${t ? `<div class="bld">바라본 건물 <b>${esc(t.addr || '')}</b><br>${esc(t.use || '')} · 지상 ${t.floors}층${t.year ? ` · ${t.year}년` : ''} · ${t.dist}m 앞</div>` : p.shot ? '<div class="bld">바라본 방향 150m 안에 건물이 없습니다</div>' : ''}
    <div class="row">
      <button class="btn small" type="button" data-mi="place">${p.shot ? '다시 지정' : '찍은 자리 지정'}</button>
      ${p.gps ? '<button class="btn small" type="button" data-mi="gps">GPS 위치 쓰기</button>' : ''}
      <button class="btn small" type="button" data-mi="close">닫기</button>
    </div>`;
}
$('minfo').addEventListener('click', e => {
  const k = e.target.closest('[data-mi]')?.dataset.mi; if (!k) return;
  if (k === 'close') { $('minfo').hidden = true; M3.sel = null; M3.mode = null; M3.preview?.clear(); highlightBuilding(null); drawShots(); renderStrip(); hint(null); }
  if (k === 'place') selectPhoto(M3.sel, true);
  if (k === 'big') openLb(M3.sel);
  if (k === 'gps') { const p = S.photos.get(M3.sel); useGps(p); savePhoto(p); M3.mode = null; M3.preview.clear(); drawShots(); renderStrip(); renderMinfo(); highlightBuilding(p.shot?.target?.i ?? null); hint(null); }
});
function useGps(p) {
  if (!p?.gps) return;
  const [X, Y] = TM.fwd(p.gps[0], p.gps[1]), [x, z] = toLocal([X, Y]);
  const t = p.heading != null ? targetBuilding(x, z, p.heading) : null;
  p.shot = { x: +X.toFixed(2), y: +Y.toFixed(2), lon: p.gps[0], lat: p.gps[1], heading: p.heading, by: 'gps', at: new Date().toISOString(),
    target: t ? { i: t.i, addr: t.b.addr, use: t.b.use, floors: t.b.floors, base: t.b.base, year: t.b.year, height: t.b.h || null, dist: +t.d.toFixed(1) } : null };
}
$('gpsAllBtn').addEventListener('click', () => {
  let n = 0; for (const p of sitePhotos()) if (!p.shot && p.gps) { useGps(p); savePhoto(p); n++; }
  drawShots(); renderStrip(); renderMinfo(); hint(`${n}장을 GPS 위치로 놓았습니다. 틀린 사진만 다시 지정하세요`, 4000);
});
$('stripList').addEventListener('click', e => { const b = e.target.closest('[data-mp]'); if (b) selectPhoto(b.dataset.mp); });
addEventListener('keydown', e => { if (M3.on && e.key === 'Escape' && $('lb').hidden && M3.mode) { M3.mode = null; M3.preview.clear(); highlightBuilding(null); hint('취소했습니다', 1500); } });

// ─────────── 시작 ───────────
let resizeT;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (!S.busy) renderPlanets(); else sizeSky(); }, 150); });
(async function boot() {
  sizeSky(); centerGalaxy(); requestAnimationFrame(frame);
  const st = await DB.get('settings', 'main');
  if (st?.elements?.length) S.elements = st.elements;
  for (const p of (await DB.all('photos')) || []) S.photos.set(p.id, p);
  for (const s of (await DB.all('sites')) || []) S.sites.set(s.id, s);
  // 이전 버전(장소별 분류)에서 넘어온 사진은 한 답사로 모은다. 원래 값은 지우지 않는다.
  const orphans = [...S.photos.values()].filter(p => !p.siteId || !S.sites.has(p.siteId));
  if (orphans.length) {
    const s = { id: uid(), name: '이전에 올린 사진', createdAt: new Date().toISOString() }; S.sites.set(s.id, s);
    for (const p of orphans) { p.siteId = s.id; if (p.ask === undefined) { p.ask = !p.element; p.by = p.element ? 'user' : null; } savePhoto(p); }
  }
  for (const s of S.sites.values()) { refreshSite(s); saveSite(s); }
  S.siteId = S.sites.has(st?.siteId) ? st.siteId : [...S.sites.values()].filter(s => s.count).sort((a, b) => (b.start || '').localeCompare(a.start || ''))[0]?.id || null;
  renderPlanets();
  if (!window.exifr) toast('촬영 정보 읽기 도구를 불러오지 못했습니다. 시간은 파일 날짜로 대신합니다', 6000);
})();
})();
</script>

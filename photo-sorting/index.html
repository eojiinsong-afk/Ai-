<title>Photo Sorting</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one night-sky stage. A site's photos gather as a spiral galaxy, Claude looks at each one, then rays carry them out to one planet per architectural element; each planet opens a card listing its photos. Uncertain photos come back as question cards. Single dark look by design. */
:root {
  color-scheme: dark;
  --space: #070A14;
  --space-2: #0D1222;
  --panel: rgba(18, 24, 42, .86);
  --panel-solid: #121A2E;
  --line: rgba(160, 180, 255, .16);
  --ink: #E9ECF7;
  --ink-2: #A9B1CC;
  --ink-3: #6E7898;
  --core: #FFE7B8;
  --accent: #8FA8FF;
  --ask: #FFD27A;
  --display: 'Space Grotesk', 'Noto Sans KR', system-ui, sans-serif;
  --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--space); color: var(--ink); font: 14px/1.5 var(--sans); overflow-x: hidden; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--space); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(var(--space) 60%, rgba(7,10,20,0)); }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; flex-wrap: wrap; }
.brand h1 { margin: 0; font: 700 20px/1 var(--display); letter-spacing: -.01em; }
.site { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.site select, .site input { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 13px; min-width: 0; }
.site input { width: 170px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: rgba(20,27,48,.7); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; transition: border-color .15s, background .15s; }
.btn:hover { border-color: rgba(160,180,255,.45); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #0A0F22; font-weight: 700; }
.btn.primary:hover { background: #A9BCFF; }
.btn.ask { border-color: rgba(255,210,122,.5); color: var(--ask); }
.btn.warn { color: #FFB4B4; }
.btn.small { padding: 4px 10px; font-size: 12px; }
.btn[disabled] { opacity: .4; cursor: default; }

/* stage */
.stage { position: relative; width: 100%; min-height: calc(100vh - 64px); }
#sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#rays { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.fx { position: absolute; inset: 0; pointer-events: none; }
.star { position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 6px; overflow: hidden; will-change: transform;
  box-shadow: 0 0 0 1.5px var(--c, rgba(255,255,255,.7)), 0 0 14px 2px var(--g, rgba(160,180,255,.35)); background: #1A2240; transition: box-shadow .5s; }
.star img { width: 100%; height: 100%; object-fit: cover; display: block; }
.star.scan { box-shadow: 0 0 0 2px var(--core), 0 0 22px 6px rgba(255,210,140,.7); }

.core { position: absolute; transform: translate(-50%, -50%); text-align: center; pointer-events: none; width: 280px; }
.core .num { font: 700 44px/1 var(--display); color: var(--core); text-shadow: 0 0 24px rgba(255,210,140,.55); font-variant-numeric: tabular-nums; }
.core .label { margin-top: 6px; color: var(--ink-2); font-size: 13px; }
.core .site-name { margin-top: 2px; color: var(--ink-3); font-size: 12px; }

.intro { position: absolute; transform: translate(-50%, 0); width: min(460px, calc(100% - 32px)); text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.intro h2 { margin: 0; font: 700 26px/1.25 var(--display); letter-spacing: -.01em; text-wrap: balance; }
.intro p { margin: 0; color: var(--ink-2); text-wrap: balance; }
.intro .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.intro .fine { font-size: 12px; color: var(--ink-3); }

/* planets */
.node { position: absolute; width: 18px; height: 18px; border-radius: 50%; transform: translate(-50%, -50%) scale(0); background: var(--c);
  box-shadow: 0 0 0 4px rgba(255,255,255,.06), 0 0 22px 6px var(--g); transition: transform .45s cubic-bezier(.3,1.6,.5,1); }
.node.on { transform: translate(-50%, -50%) scale(1); }
.node.pulse { animation: pulse .35s ease-out; }
@keyframes pulse { 50% { transform: translate(-50%, -50%) scale(1.35); } }

.card { position: absolute; width: 248px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; transform: scale(.85); transition: opacity .4s, transform .45s cubic-bezier(.2,1.2,.4,1); overflow: hidden; }
.card.on { opacity: 1; transform: none; }
.card::before { content: ""; height: 3px; background: var(--c); display: block; }
.card-head { padding: 10px 12px 8px; display: flex; flex-direction: column; gap: 2px; }
.card-title { display: flex; align-items: center; gap: 8px; }
.card-title .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--g); flex: none; }
.card-title b { flex: 1; min-width: 0; font-size: 15px; }
.card-title .count { font: 500 12px var(--mono); color: var(--ink-2); flex: none; }
.card-meta { font-size: 11.5px; color: var(--ink-3); }
.thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 0 10px 10px; overflow-y: auto; max-height: 172px; }
.thumb { position: relative; aspect-ratio: 1; border-radius: 5px; overflow: hidden; border: 0; padding: 0; cursor: pointer; background: #1A2240; opacity: 0; transform: translateY(6px); transition: opacity .3s, transform .3s; }
.card.on .thumb { opacity: 1; transform: none; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb:hover img { filter: brightness(1.15); }
.thumb .q { position: absolute; right: 2px; top: 2px; width: 15px; height: 15px; border-radius: 50%; background: var(--ask); color: #2A1C00; font: 700 10px/15px var(--sans); text-align: center; }
.thumb .me { position: absolute; left: 2px; bottom: 2px; width: 7px; height: 7px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1.5px rgba(7,10,20,.8); }

/* question sheet */
.ask-sheet { position: fixed; z-index: 45; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(560px, calc(100vw - 32px));
  background: var(--panel-solid); border: 1px solid rgba(255,210,122,.35); border-radius: 18px; box-shadow: 0 16px 50px rgba(0,0,0,.55);
  display: grid; grid-template-columns: 168px 1fr; gap: 16px; padding: 14px; animation: rise .35s cubic-bezier(.2,1.2,.4,1); }
@keyframes rise { from { transform: translate(-50%, 24px); opacity: 0; } }
.ask-img { width: 168px; height: 168px; border-radius: 10px; overflow: hidden; background: #1A2240; cursor: zoom-in; border: 0; padding: 0; }
.ask-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ask-body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ask-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ask-top .n { font: 500 12px var(--mono); color: var(--ask); }
.ask-q { margin: 0; font: 700 17px/1.35 var(--sans); }
.ask-guess { margin: 0; font-size: 12.5px; color: var(--ink-2); }
.ask-guess b { color: var(--ask); font-weight: 700; }
.ask-foot { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }

/* lightbox */
.lb { position: fixed; inset: 0; z-index: 50; background: rgba(4,6,12,.86); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  display: grid; grid-template-columns: 1fr 300px; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.lb-img { display: flex; align-items: center; justify-content: center; padding: 24px; min-width: 0; min-height: 0; position: relative; }
.lb-img img { max-width: 100%; max-height: calc(100vh - 48px); object-fit: contain; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
.lb-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: rgba(18,24,42,.8); cursor: pointer; font-size: 18px; }
.lb-nav.prev { left: 16px; } .lb-nav.next { right: 16px; }
.lb-side { background: var(--panel-solid); border-left: 1px solid var(--line); padding: 20px 18px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.lb-side h3 { margin: 0; font-size: 15px; word-break: break-all; }
.lb-close { align-self: flex-end; }
.ai-box { background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font-size: 12.5px; color: var(--ink-2); }
.ai-box b { color: var(--ink); }
dl.meta { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12.5px; }
dl.meta dt { color: var(--ink-3); }
dl.meta dd { margin: 0; font-family: var(--mono); font-size: 12px; color: var(--ink); word-break: break-all; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--ink-3); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 13px; cursor: pointer; font-size: 13.5px; color: var(--ink); }
.chip .k { font: 500 10.5px var(--mono); color: var(--ink-3); margin-right: 4px; }
.chip.guess { border-color: rgba(255,210,122,.6); }
.chip.on { background: var(--accent); border-color: var(--accent); color: #0A0F22; font-weight: 700; }
.chip.on .k { color: #2A3570; }
.add-el { display: flex; gap: 6px; }
.add-el input { flex: 1; min-width: 0; font-size: 13px; background: var(--space-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; }
.hint { font-size: 11.5px; color: var(--ink-3); }

.toast { position: fixed; left: 50%; top: calc(72px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 60; background: var(--panel-solid); border: 1px solid var(--line);
  padding: 9px 16px; border-radius: 999px; font-size: 13px; max-width: calc(100vw - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.4); }
.drop { position: fixed; inset: 0; z-index: 40; border: 2px dashed var(--accent); background: rgba(143,168,255,.08); display: flex; align-items: center; justify-content: center; pointer-events: none; }
.drop p { font: 700 18px var(--display); background: var(--panel-solid); padding: 12px 22px; border-radius: 999px; border: 1px solid var(--line); }

@media (max-width: 760px) {
  .bar { position: relative; top: 0; background: var(--space); }
  .btn { padding: 6px 11px; }
  .site input { width: 130px; }
  .ask-sheet { grid-template-columns: 96px 1fr; gap: 12px; }
  .ask-img { width: 96px; height: 96px; }
  .ask-q { font-size: 15px; }
  .lb { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; overflow-y: auto; }
  .lb-img { padding: 12px; }
  .lb-img img { max-height: 52vh; }
  .lb-side { border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); }
}
@media (prefers-reduced-motion: reduce) {
  .card, .thumb, .node { transition: none; }
  .ask-sheet { animation: none; }
}
</style>

<header class="bar" id="bar">
  <div class="brand">
    <h1>Photo Sorting</h1>
    <div class="site" id="siteBox" hidden>
      <select id="siteSel" aria-label="답사 고르기"></select>
      <input id="siteName" aria-label="답사 장소 이름" maxlength="40">
    </div>
  </div>
  <div class="actions">
    <button class="btn ask" id="askBtn" type="button" hidden>질문 0</button>
    <button class="btn" id="replayBtn" type="button" disabled>다시 보기</button>
    <button class="btn" id="zipBtn" type="button" disabled>ZIP 저장</button>
    <button class="btn" id="newSiteBtn" type="button" hidden>새 답사</button>
    <button class="btn warn" id="clearBtn" type="button" hidden>이 답사 지우기</button>
    <label class="btn primary" for="fileIn">사진 올리기</label>
    <input id="fileIn" type="file" accept="image/*,.heic,.heif" multiple hidden>
  </div>
</header>

<main class="stage" id="stage">
  <canvas id="sky" aria-hidden="true"></canvas>
  <svg id="rays" aria-hidden="true"></svg>
  <div id="planets"></div>
  <div class="fx" id="fx"></div>
  <div class="core" id="core" hidden><div class="num" id="coreNum">0</div><div class="label" id="coreLabel"></div><div class="site-name" id="coreSite"></div></div>
  <div class="intro" id="intro">
    <h2>한 장소의 답사 사진을 놓으면, 건축요소별 행성으로 나뉩니다</h2>
    <p>사진이 은하수로 모이면 Claude가 한 장씩 보고 입구·창·계단으로 나눕니다. 애매한 사진은 질문으로 물어봅니다. 가로 2000px보다 큰 사진은 2000px로 줄여 보관합니다.</p>
    <div class="row">
      <label class="btn primary" for="fileIn">사진 올리기</label>
      <button class="btn" id="demoBtn" type="button">예시로 보기</button>
    </div>
    <p class="fine">사진 파일은 이 브라우저에 저장됩니다. 분류할 때만 작게 줄인 사진을 Claude에게 보여 주며, 처음 한 번 허용을 묻습니다.</p>
  </div>
</main>

<section class="ask-sheet" id="ask" hidden aria-live="polite" aria-label="분류 질문">
  <button class="ask-img" id="askImgBtn" type="button" aria-label="크게 보기"><img id="askImg" alt=""></button>
  <div class="ask-body">
    <div class="ask-top"><span class="n" id="askN"></span><button class="btn small" id="askClose" type="button">나중에</button></div>
    <p class="ask-q">이 사진은 어떤 건축요소인가요?</p>
    <p class="ask-guess" id="askGuess"></p>
    <div class="chips" id="askChips"></div>
    <div class="ask-foot"><button class="btn small" id="askSkip" type="button">건너뛰기</button></div>
  </div>
</section>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="사진 보기">
  <div class="lb-img">
    <img id="lbImg" alt="">
    <button class="lb-nav prev" id="lbPrev" type="button" aria-label="이전 사진">‹</button>
    <button class="lb-nav next" id="lbNext" type="button" aria-label="다음 사진">›</button>
  </div>
  <aside class="lb-side">
    <button class="btn lb-close" id="lbClose" type="button">닫기 · Esc</button>
    <h3 id="lbName"></h3>
    <div class="ai-box" id="lbAi" hidden></div>
    <div class="field">건축요소 <span class="hint">숫자키로도 지정</span>
      <div class="chips" id="lbChips"></div>
      <form class="add-el" id="addElForm"><input id="addElInput" placeholder="요소 추가 (예: 지붕)" maxlength="12"><button class="btn" type="submit">추가</button></form>
    </div>
    <dl class="meta" id="lbMeta"></dl>
    <p class="hint">← → 사진 넘기기</p>
  </aside>
</div>

<div class="drop" id="drop" hidden><p>놓으면 은하수로 모입니다</p></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script>
(() => {
'use strict';

// ─────────── 설정 ───────────
const MAX_W = 2000;          // 저장 이미지 가로 최대 px
const THUMB = 220;           // 애니메이션·목록용
const AI_SIDE = 768;         // Claude에게 보여 줄 크기
const SURE = 0.6;            // 이보다 확신이 낮으면 질문으로
const DEFAULT_ELEMENTS = ['입구', '창', '계단'];
const OTHER = '기타', NONE = '미분류';
const PALETTE = [
  ['#8FA8FF', 'rgba(143,168,255,.55)'], ['#FFB86B', 'rgba(255,184,107,.55)'], ['#6FE3B4', 'rgba(111,227,180,.5)'],
  ['#E39BFF', 'rgba(227,155,255,.5)'], ['#FF8FA3', 'rgba(255,143,163,.5)'], ['#6FD6F0', 'rgba(111,214,240,.5)'],
  ['#F2E27A', 'rgba(242,226,122,.45)'], ['#B7A6FF', 'rgba(183,166,255,.5)']
];
const GREY = ['#9AA3BD', 'rgba(154,163,189,.4)'], DIM = ['#5E6784', 'rgba(94,103,132,.35)'];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ─────────── 상태 ───────────
const S = { photos: new Map(), sites: new Map(), siteId: null, elements: [...DEFAULT_ELEMENTS], busy: false, lbId: null, askQueue: [], askId: null };
const $ = id => document.getElementById(id);
const stage = $('stage'), fx = $('fx'), raysSvg = $('rays'), planetsEl = $('planets');
const urls = new Map();
const objUrl = (key, blob) => { if (!urls.has(key)) urls.set(key, URL.createObjectURL(blob)); return urls.get(key); };
const thumbUrl = p => p.thumb ? objUrl('t' + p.id, p.thumb) : '';
const fullUrl = p => p.blob ? objUrl('f' + p.id, p.blob) : thumbUrl(p);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const sleep = ms => new Promise(r => setTimeout(r, reduceMotion ? 0 : ms));
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function toast(msg, ms = 2800) {
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), ms);
}

// ─────────── 저장 (IndexedDB, 이 브라우저 안) ───────────
const DB = (() => {
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open('photo-sorting', 2);
        r.onupgradeneeded = () => { for (const s of ['photos', 'planets', 'settings', 'sites']) if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
    return dbp;
  }
  async function run(store, mode, fn) {
    try {
      const db = await open();
      return await new Promise((res, rej) => {
        const tx = db.transaction(store, mode); const out = fn(tx.objectStore(store));
        tx.oncomplete = () => res(out && 'result' in out ? out.result : undefined); tx.onerror = () => rej(tx.error);
      });
    } catch (e) { console.warn('저장소 사용 불가', e); return undefined; }
  }
  return {
    put: (s, k, v) => run(s, 'readwrite', o => o.put(v, k)),
    del: (s, k) => run(s, 'readwrite', o => o.delete(k)),
    get: (s, k) => run(s, 'readonly', o => o.get(k)),
    all: s => run(s, 'readonly', o => o.getAll())
  };
})();
const savePhoto = p => (p.demo ? null : DB.put('photos', p.id, p));
const saveSite = s => (s.demo ? null : DB.put('sites', s.id, s));
const saveSettings = () => DB.put('settings', 'main', { elements: S.elements, siteId: S.siteId });

// ─────────── 사진 읽기: EXIF + 2000px ───────────
let heicLoading = null;
function loadHeic() {
  if (window.heic2any) return Promise.resolve();
  heicLoading = heicLoading || new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';
    s.onload = res; s.onerror = () => rej(new Error('HEIC 변환기를 불러오지 못했습니다'));
    document.head.appendChild(s);
  });
  return heicLoading;
}
const isHeic = f => /\.(heic|heif)$/i.test(f.name) || /heic|heif/i.test(f.type);
const localIso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;

async function readMeta(file) {
  let m = null;

    todo = files.filter(f => !seen.has(`${f.name}|${f.size}|${f.lastModified}`));

  const site = S.sites.get(S.siteId);

  spin = .18; glow = .7;

    await sleep(500);

    const site = S.sites.get(S.siteId), root = safe(site?.name || '답사');
    const entries = [], rows = [['답사', '건축요소', '분류 방법', 'Claude 판단', 'Claude 확신', 'Claude 메모', '파일', '원본 파일명', '촬영시각', '위도', '경도', '방향(도)', '기종', '가로', '세로']];
    const meta = { app: 'photo-sorting', format: 2, exportedAt: new Date().toISOString(),
      site: { name: site?.name, start: site?.start, end: site?.end, center: site?.center }, elements: [] };
    for (const [i, pl] of planetList().entries()) {
      const folder = `${root}/${pad(i + 1)}_${safe(pl.name)}`, used = new Set(), group = { element: pl.name, photos: [] };
      for (const p of photosOf(pl.id)) {
        if (p.demo) continue;
        const base = `${p.takenAt.slice(11, 16).replace(':', '')}_${safe(p.name.replace(/\.[^.]+$/, ''))}`;
        let fn = base + '.jpg', n = 2; while (used.has(fn)) fn = `${base}_${n++}.jpg`; used.add(fn);
        entries.push({ name: `${folder}/${fn}`, data: new Uint8Array(await p.blob.arrayBuffer()), date: new Date(p.takenAt) });
        rows.push([site?.name || '', pl.name, p.by === 'user' ? '직접' : p.by === 'ai' ? 'Claude' : '', p.aiElement || '', p.aiConf != null ? p.aiConf.toFixed(2) : '', p.aiNote || '',
          `${folder}/${fn}`, p.name, p.takenAt.replace('T', ' '), p.gps?.[1] ?? '', p.gps?.[0] ?? '', p.heading ?? '', p.camera || '', p.w, p.h]);
        group.photos.push({ file: `${folder}/${fn}`, original: p.name, takenAt: p.takenAt, gps: p.gps, heading: p.heading, element: p.element, by: p.by, ai: { element: p.aiElement, confidence: p.aiConf, note: p.aiNote } });
      }
      if (group.photos.length) meta.elements.push(group);
    }
    const csv = '﻿' + rows.map(r => r.map(v => { const t = String(v); return /[",\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; }).join(',')).join('\r\n');
    entries.push({ name: `${root}/사진목록.csv`, data: new TextEncoder().encode(csv) });
    entries.push({ name: `${root}/photo-sorting.json`, data: new TextEncoder().encode(JSON.stringify(meta, null, 1)) });
    await saveFile(`${root}.zip`, makeZip(entries));
  } catch (e) { console.error(e); toast('ZIP을 만들지 못했습니다: ' + e.message, 5000); }
  finally { btn.textContent = 'ZIP 저장'; updateButtons(); }
}
let downloadsCap;
async function saveFile(name, blob) {
  if (downloadsCap === undefined) downloadsCap = window.claude?.use ? await window.claude.use('downloads').catch(() => null) : null;
  if (downloadsCap) {
    try { await downloadsCap.save({ filename: name, data: blob }); toast('저장했습니다'); }
    catch (e) { if (e?.code !== 'declined') toast('저장하지 못했습니다 (' + (e?.code || e?.message) + ')', 5000); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
$('zipBtn').addEventListener('click', exportZip);

// ─────────── 시작 ───────────
let resizeT;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (!S.busy) renderPlanets(); else sizeSky(); }, 150); });
(async function boot() {
  sizeSky(); centerGalaxy(); requestAnimationFrame(frame);
  const st = await DB.get('settings', 'main');
  if (st?.elements?.length) S.elements = st.elements;
  for (const p of (await DB.all('photos')) || []) S.photos.set(p.id, p);
  for (const s of (await DB.all('sites')) || []) S.sites.set(s.id, s);
  // 이전 버전(장소별 분류)에서 넘어온 사진은 한 답사로 모은다. 원래 값은 지우지 않는다.
  const orphans = [...S.photos.values()].filter(p => !p.siteId || !S.sites.has(p.siteId));
  if (orphans.length) {
    const s = { id: uid(), name: '이전에 올린 사진', createdAt: new Date().toISOString() }; S.sites.set(s.id, s);
    for (const p of orphans) { p.siteId = s.id; if (p.ask === undefined) { p.ask = !p.element; p.by = p.element ? 'user' : null; } savePhoto(p); }
  }
  for (const s of S.sites.values()) { refreshSite(s); saveSite(s); }
  S.siteId = S.sites.has(st?.siteId) ? st.siteId : [...S.sites.values()].filter(s => s.count).sort((a, b) => (b.start || '').localeCompare(a.start || ''))[0]?.id || null;
  renderPlanets();
  if (!window.exifr) toast('촬영 정보 읽기 도구를 불러오지 못했습니다. 시간은 파일 날짜로 대신합니다', 6000);
})();
})();
